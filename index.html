<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0708">
<title>basswerk: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0B0708;--surface:#141011;--raised:#1C1718;--raised-2:#2A2325;--line:#2F2829;--line-strong:#655B5D;--text:#F3EFEF;--muted:#9C9092;--ok:#2DB36F;--fd:Unbounded,"Arial Black",system-ui,sans-serif;--fs:Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fs);font-size:16px;line-height:24px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
svg.i{display:block;flex:none}
.av{display:grid;place-items:center;border-radius:50%;flex:none;font-family:var(--fd);font-weight:900;color:#F3EFEF;background:radial-gradient(120% 120% at 20% 100%,#5A4146,#1C1718 70%)}
.tag{flex:none;height:24px;padding:0 7px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-size:13px;font-weight:500;line-height:1;white-space:nowrap}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn-fill{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-fill:hover{opacity:.92}
.ghost{color:var(--muted);border-radius:8px}
.ghost:hover{color:var(--text);background:var(--surface)}
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#1C1718}

/* ---------- волна ---------- */
.wave{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wave canvas{display:block;width:100%;height:100%}
.w-line{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,255,255,.85);pointer-events:none;opacity:0}
.w-tip{position:absolute;top:-30px;transform:translateX(-50%);height:22px;padding:0 7px;display:inline-flex;align-items:center;border-radius:4px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;line-height:1;font-weight:600;pointer-events:none;white-space:nowrap;opacity:0}
.wave.is-hover .w-line,.wave.is-hover .w-tip{opacity:1}

/* ---------- десктоп ---------- */
/* весь десктоп в масштабе 80%: высоту подгоняет fitDesk() */
.d{zoom:.8;height:125vh;display:flex;flex-direction:column;overflow:hidden}
.d-head{flex:none;border-bottom:1px solid var(--line)}
.d-head-in{max-width:2400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.d-logo img{height:36px;width:auto;display:block}
.d-search{flex:1 1 320px;max-width:760px;position:relative;display:flex;align-items:center}
.d-search input{width:100%;height:44px;padding:0 16px 0 42px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.d-search input::placeholder{color:var(--muted)}
.d-search svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.d-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon44{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.icon44:hover{background:var(--surface)}
.ticker{flex:none;height:36px;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;line-height:16px;display:flex;align-items:center}
.ticker-l{flex:none;padding:0 16px 0 24px;display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.06em;background:var(--surface);position:relative;z-index:1;height:100%}
.ticker-l i{width:7px;height:7px;border-radius:50%;background:var(--text)}
.ticker-run{display:flex;gap:28px;white-space:nowrap;animation:run 60s linear infinite;padding-right:28px}
.ticker-run span{display:inline-flex;gap:8px}
.ticker-run b{font-weight:700}.ticker-run .plus{color:var(--ok)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-run{animation:none}}
.d-shell{flex:1;min-height:0;display:flex;position:relative;max-width:2400px;width:100%;margin:0 auto}
.strip{width:88px;flex:none;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.strip-top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.strip ol{list-style:none;margin:0;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:16px}
.strip li button{width:76px;display:flex;flex-direction:column;align-items:center;gap:8px}
.strip .ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line-strong)}
.strip .ring.sale{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ok)}
.strip .ring.beat{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.strip small{font-family:var(--fd);font-weight:700;font-size:11px;line-height:14px;white-space:nowrap;color:var(--muted)}
.strip small.sale{color:var(--ok)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:clamp(420px,30cqw,580px);background:var(--bg);border-right:1px solid var(--line);z-index:30;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:24px 0 48px rgba(0,0,0,.5)}
.scrim{position:absolute;inset:0;z-index:25;background:rgba(11,7,8,.62);opacity:0;pointer-events:none;transition:opacity .28s}
.is-feed .drawer{transform:none}
.is-feed .scrim{opacity:1;pointer-events:auto}
.is-feed .d-main{overflow:hidden}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.d-main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;container-type:inline-size}
.page{max-width:1640px;margin:0 auto;padding:20px 32px 64px}
.hero{border-radius:20px;color:#F5F2F2;background:linear-gradient(110deg,var(--band2,#1B1718) 0%,var(--band,#2A2325) 62%);transition:background .5s ease}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;padding:32px}
.hero-l{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero-top{display:flex;gap:24px;align-items:flex-start}
.h-play{width:72px;height:72px;flex:none;margin-top:6px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center}
.h-play:hover{transform:scale(1.04)}
.h-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;color:rgba(245,242,242,.75)}
.h-badge b{height:20px;padding:0 6px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.5);border-radius:4px;color:#F5F2F2}
.h-title{margin:6px 0 0;font-family:var(--fd);font-weight:900;font-size:56px;line-height:60px;letter-spacing:-.015em;text-transform:uppercase;overflow-wrap:break-word;text-wrap:balance}
.h-title.l{font-size:44px;line-height:48px}.h-title.xl{font-size:36px;line-height:40px}
.h-meta{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:16px;line-height:22px;color:rgba(245,242,242,.75)}
.h-meta a{color:#F5F2F2;font-weight:600}
.h-tag{height:26px;padding:0 8px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.32);border-radius:4px;font-size:13px;font-weight:500;color:rgba(245,242,242,.9)}
.hero .wave{height:151px;margin-right:60px;cursor:pointer}
.hero .w-now,.hero .w-dur{position:absolute;right:-60px;width:52px;text-align:right;font-size:13px;line-height:18px}
.hero .w-now{top:68px;font-weight:700;color:#fff}
.hero .w-dur{top:95px;color:rgba(245,242,242,.62)}
.h-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-btn{height:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(0,0,0,.16);border:1px solid rgba(245,242,242,.26);color:#F5F2F2}
.h-btn:hover{background:rgba(0,0,0,.3);border-color:rgba(245,242,242,.6)}
.h-btn.on{background:#F5F2F2;color:#0B0708;border-color:#F5F2F2}
.h-btn.round{width:44px;padding:0;justify-content:center}
.h-buy{margin-left:auto;height:48px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;background:#F5F2F2;color:#0B0708;font-size:15px;font-weight:700;white-space:nowrap}
.h-buy:hover{background:#fff}
.hero-cover{border-radius:12px;box-shadow:0 20px 56px rgba(0,0,0,.4)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start;margin-top:28px}
.sec-h{margin:0;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.facts{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px}
.facts div{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.facts dt{font-size:14px;line-height:18px;color:var(--muted)}
.facts dd{margin:4px 0 0;font-weight:600;font-size:16px;line-height:22px;display:flex;flex-wrap:wrap;gap:4px}
.comments{list-style:none;margin:0;padding:0}
.comments li{padding:16px 0;border-bottom:1px solid var(--line)}
.c-row{display:flex;gap:12px}
.c-head{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.c-head b{font-weight:600;font-size:15px;color:var(--text)}
.c-text{margin:4px 0 0;font-size:15px;line-height:22px}
.c-acts{margin:6px 0 0 -10px;display:flex;gap:2px}
.c-acts button{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.author{height:18px;padding:0 5px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.06em;color:var(--text);align-self:center}
.lic{padding:20px;display:flex;flex-direction:column}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.seg4 button{height:34px;border-radius:9px;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg4 button:hover{color:var(--text)}
.seg4 button.on{background:var(--raised-2);color:var(--text)}
.terms{margin:6px 0 0;display:flex;flex-direction:column}
.terms div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.terms dt{color:var(--muted)}.terms dd{margin:0;text-align:right;font-weight:500}
.note{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;font-size:14px;line-height:19px;color:var(--muted)}
.note a{text-decoration:underline;text-underline-offset:2px}
.more-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.more-row:hover{background:var(--raised)}
.more-row .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.more-row img{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.pl-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center}
.pl-btn:hover{border-color:var(--text)}
.d-player{flex:none;background:var(--raised);border-top:1px solid var(--line)}
.d-player-in{max-width:2400px;margin:0 auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:16px}
.d-player img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.pp{width:44px;height:44px;flex:none;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.prog{flex:1;max-width:560px;height:4px;border-radius:999px;background:var(--line);overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;background:var(--text);width:0}
@container (max-width:1240px){.cols{grid-template-columns:minmax(0,1fr) 360px}.hero-grid{grid-template-columns:minmax(0,1fr) 340px;gap:36px}}
@container (max-width:1020px){.cols{grid-template-columns:minmax(0,1fr)}.side{order:-1}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-grid{grid-template-columns:minmax(0,1fr) 240px;gap:28px;padding:24px}.h-title{font-size:40px;line-height:44px}}
@container (max-width:720px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-cover{display:none}}

/* ---------- лента (колонка на главной и выезжающая панель) ---------- */
.fp-head{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px}
.fp-row{display:flex;align-items:center;gap:8px}
.fp-head h2{margin:0;font-family:var(--fd);font-weight:700;font-size:22px;line-height:28px}
.fp-head .f-pop{right:0}
.composer{margin:0;padding:16px 20px;display:flex;gap:12px;border-bottom:1px solid var(--line)}
.composer input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.composer input::placeholder{color:var(--muted)}
.cmp-row{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cmp-att{height:36px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent}
.cmp-att:hover{color:var(--text);background:var(--surface)}
.cmp-att.on{color:var(--text);border-color:var(--line-strong);background:var(--surface)}
.cmp-go{margin-left:auto;height:36px;padding:0 14px;border-radius:999px;font-size:13px}
.cmp-hint{margin:8px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.fl{list-style:none;margin:0;padding:0}
.fl-end{margin:0;padding:24px 20px 40px;text-align:center;font-size:13px;color:var(--muted)}
.post{padding:16px 20px;border-bottom:1px solid var(--line)}
.p-head{display:flex;align-items:center;gap:12px}
.p-head b{display:block;font-weight:600;font-size:15px;line-height:20px}
.p-head small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.p-head .icon44{width:36px;height:36px;margin-right:-8px}
.p-text{margin:10px 0 0;font-size:15px;line-height:22px}
.p-img{display:block;width:100%;margin-top:12px;border-radius:12px;overflow:hidden}
.p-img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.att{margin-top:12px;display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.att-cv{flex:none}
.att-cv img{display:block;width:84px;height:84px;border-radius:8px;object-fit:cover}
.att-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.att-top{display:flex;align-items:center;gap:10px}
.att-top .pl-btn{width:36px;height:36px}
.att-t{display:block;max-width:100%;text-align:left;font-family:var(--fd);font-weight:900;font-size:14px;line-height:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-t:hover{text-decoration:underline}
.att-s{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.att-price{flex:none;font-family:var(--fd);font-weight:700;font-size:13px;white-space:nowrap}
.att .wave{height:33px;cursor:pointer}
.p-acts{margin:8px 0 0 -10px;display:flex;gap:2px}
.p-acts button{height:36px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.p-acts button:hover{color:var(--text);background:var(--surface)}
.p-acts button.on{color:var(--text)}
.poll{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.poll button{position:relative;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;overflow:hidden;text-align:left}
.poll button:hover{border-color:var(--text)}
.poll.done button{border-color:var(--line)}
.poll i{position:absolute;left:0;top:0;bottom:0;background:var(--raised-2);transition:width .4s ease}
.poll button.me i{background:#463C3E}
.poll span,.poll b{position:relative;display:inline-flex;align-items:center;gap:6px}
.poll small{font-size:13px;line-height:18px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.ev-av{position:relative;flex:none}
.ev-av i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--raised-2);border:2px solid var(--bg);color:var(--text)}
.ev-av i.sale{background:var(--ok);color:#0B0708}
.ev p{margin:0;flex:1;min-width:0}
.ev p b{font-weight:600}
.ev .lnk{font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.ev button.lnk:hover{text-decoration:underline}
.ev small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.ev-amt{flex:none;font-weight:700;color:var(--ok);font-size:14px;white-space:nowrap}
.ev-cv{flex:none}
.ev-cv img{display:block;width:44px;height:44px;border-radius:6px;object-fit:cover}
.d-shell{container-type:inline-size}
.dock{width:clamp(440px,28cqw,560px);flex:none;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.strip .ring.repost{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line-strong)}
.ticker-run button{font:inherit;font-weight:500}
.ticker-run button:hover{text-decoration:underline;text-underline-offset:2px}
.ticker:hover .ticker-run{animation-play-state:paused}
.lic-price{margin:18px 0 0;font-family:var(--fd);font-weight:900;font-size:36px;line-height:42px;letter-spacing:-.01em;white-space:nowrap}
.tag.sm{height:22px;font-size:12px;padding:0 6px}
.tag.md{height:26px;font-size:13px}
.tag.xs{height:18px;font-size:12px;padding:0 5px}

/* ---------- главная: топ ---------- */
.home{max-width:1640px;margin:0 auto;padding:22px 32px 48px}
.top-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttabs{display:flex;gap:4px;margin-left:-12px}
.ttabs button{height:44px;padding:0 12px;border-radius:10px;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px;color:var(--muted)}
.ttabs button:hover{color:var(--text)}
.ttabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text);border-radius:0}
.top-head .seg2{margin-left:auto}
.top-body{margin-top:16px}
.top-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:stretch}
.feat{border-radius:20px;background:linear-gradient(110deg,var(--band2,#1B1718) 0%,var(--band,#2A2325) 70%);color:#F5F2F2;padding:24px;display:grid;grid-template-columns:248px minmax(0,1fr);gap:28px;transition:background .5s ease}
.feat-cv{display:block;border-radius:12px;overflow:hidden;box-shadow:0 16px 40px rgba(0,0,0,.35);align-self:start}
.feat-r{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.feat-top{display:flex;gap:18px;align-items:flex-start}
.feat .h-play{width:60px;height:60px;margin-top:2px}
.feat-t{display:block;max-width:100%;margin:4px 0 0;text-align:left;font-family:var(--fd);font-weight:900;font-size:40px;line-height:46px;letter-spacing:-.01em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feat-t:hover{text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px}
.feat .h-meta{margin-top:8px;font-size:15px}
.feat .wave{height:73px;margin-right:52px;cursor:pointer}
.feat .w-now,.feat .w-dur{position:absolute;right:-52px;width:46px;text-align:right;font-size:13px;line-height:18px}
.feat .w-now{top:30px;font-weight:700;color:#fff}
.feat .w-dur{top:50px;color:rgba(245,242,242,.62)}
.feat-buy{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lseg{display:inline-flex;padding:3px;gap:2px;border-radius:12px;background:rgba(0,0,0,.22);border:1px solid rgba(245,242,242,.16)}
.lseg button{height:36px;padding:0 10px;border-radius:9px;font-size:12px;font-weight:700;letter-spacing:.02em;color:rgba(245,242,242,.72);white-space:nowrap}
.lseg button:hover{color:#fff}
.lseg button.on{background:rgba(245,242,242,.95);color:#0B0708}
.feat-price{margin-left:auto;font-family:var(--fd);font-weight:900;font-size:22px;line-height:28px;white-space:nowrap}
.feat .h-buy{margin-left:0}
.hot{border:1px solid var(--line);border-radius:20px;background:var(--surface);padding:14px 8px 8px;min-width:0}
.hot h3{margin:0;padding:0 12px 6px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;font-family:var(--fd);font-weight:700;font-size:15px;line-height:20px}
.hot h3 span{font-family:var(--fs);font-weight:500;font-size:13px;color:var(--muted)}
.hot ol{list-style:none;margin:0;padding:0}
.hrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:12px}
.hrow:hover{background:var(--raised)}
.hrow .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.hrank{width:22px;flex:none;font-family:var(--fd);font-weight:900;font-size:17px;text-align:center}
.hrow img{width:52px;height:52px;border-radius:8px;object-fit:cover;flex:none}
.ht{display:block;font-family:var(--fd);font-weight:800;font-size:14px;line-height:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{display:block;margin-top:3px;font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.delta{flex:none;min-width:34px;display:inline-flex;align-items:center;justify-content:flex-end;gap:1px;font-size:13px;font-weight:700;color:var(--muted)}
.delta.rise{color:var(--ok)}
.delta.nw{font-family:var(--fd);font-size:9px;letter-spacing:.05em;color:var(--text)}
.pgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.pcard{position:relative;min-width:0;padding:22px 16px 16px;border:1px solid var(--line);border-radius:18px;background:var(--surface);display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}
.prank{position:absolute;left:16px;top:12px;font-family:var(--fd);font-weight:900;font-size:22px;line-height:28px}
.pcard h3{margin:10px 0 0;max-width:100%;font-family:var(--fd);font-weight:800;font-size:16px;line-height:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard p{margin:0;font-size:13px;line-height:18px;color:var(--muted)}
.pcard .pstat{margin-top:8px;color:var(--text);font-size:14px}
.pcovers{margin:12px 0;height:56px;display:flex;gap:6px}
.pcovers img{display:block;width:56px;height:56px;border-radius:6px;object-fit:cover}
.plast{width:100%;margin:12px 0;padding:6px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;gap:10px}
.plast:hover{border-color:var(--line-strong)}
.plast img{width:44px;height:44px;border-radius:6px;object-fit:cover;flex:none}
.plast small{display:block;font-size:12px;line-height:16px;color:var(--muted)}
.plast b{display:block;font-family:var(--fd);font-weight:800;font-size:13px;line-height:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .btn{width:100%;height:40px;margin-top:auto}

/* ---------- главная: все биты ---------- */
.all{margin-top:40px}
.all-head{position:sticky;top:0;z-index:6;background:var(--bg);margin:0 -32px;padding:12px 32px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}
.all-head h2{flex:none}
.gchips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 24px),transparent)}
.gchips::-webkit-scrollbar{display:none}
.gchips .chip{flex:none;height:36px;padding:0 14px;font-size:14px}
.gtools{flex:none;position:relative;display:flex;gap:2px}
.gtools .icon44{position:relative}
.gtools .icon44.on{color:var(--text);background:var(--raised-2)}
.cnt{position:absolute;right:4px;top:4px;min-width:16px;height:16px;padding:0 4px;border-radius:999px;background:var(--text);color:var(--bg);font-size:10px;line-height:16px;font-weight:700}
.gpop{position:absolute;right:0;top:calc(100% + 8px);z-index:8;width:320px;padding:16px;background:var(--raised-2);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.5)}
.gpop h4{margin:0 0 8px;font-size:13px;line-height:18px;font-weight:600;color:var(--muted)}
.gpop .opts{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.g-q{margin:16px 0 0;display:flex;align-items:center;gap:12px;font-size:15px;color:var(--muted)}
.g-q .ghost{height:32px;padding:0 10px;font-size:14px;font-weight:600;color:var(--text)}
.bgrid{margin-top:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:28px 20px}
.bcard{min-width:0}
.bcv{position:relative;border-radius:12px;overflow:hidden;background:var(--raised)}
.bcv .cover{transition:transform .3s ease}
.bcard:hover .bcv .cover{transform:scale(1.03)}
.bplay{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center;box-shadow:0 6px 18px rgba(0,0,0,.4);opacity:0;transform:scale(.9);transition:opacity .15s,transform .15s}
.bcard:hover .bplay,.bplay:focus-visible,.bcard.here .bplay{opacity:1;transform:none}
.blike{position:absolute;right:8px;top:8px;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:rgba(11,7,8,.55);color:#F5F2F2;opacity:0;transition:opacity .15s}
.bcard:hover .blike,.blike.on,.blike:focus-visible{opacity:1}
.bprog{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.22)}
.bprog i{display:block;height:100%;background:#fff;width:0}
.bt{display:block;max-width:100%;margin-top:10px;text-align:left;font-family:var(--fd);font-weight:900;font-size:15px;line-height:20px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt:hover{text-decoration:underline}
.bs{margin:2px 0 0;font-size:14px;line-height:20px;color:var(--muted)}
.brow{margin:8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.skel .bcv{aspect-ratio:1;animation:sk 1.1s ease-in-out infinite}
.skel i{display:block;height:14px;margin-top:12px;border-radius:4px;background:var(--raised);animation:sk 1.1s ease-in-out infinite}
@keyframes sk{50%{opacity:.45}}
.gend{margin:28px 0 0;padding:20px;border:1px dashed var(--line-strong);border-radius:14px;text-align:center;color:var(--muted);font-size:15px}
@container (max-width:1240px){.top-grid{grid-template-columns:minmax(0,1fr)}.hot ol{display:grid;grid-template-columns:1fr 1fr;column-gap:8px}.pgrid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@container (max-width:860px){.feat{grid-template-columns:minmax(0,1fr)}.feat-cv{display:none}.hot ol{grid-template-columns:1fr}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}.all-head{flex-wrap:wrap}.gchips{order:3;flex-basis:100%}}

/* ---------- телефон ---------- */
.m{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.m-top{flex:none;padding-top:env(safe-area-inset-top);background:var(--bg)}
.m-head{height:52px;padding:0 8px 0 16px;display:flex;align-items:center;gap:4px}
.m-head .d-logo{margin-right:auto}
.m-head .d-logo img{height:30px}
.m .ticker{height:34px;font-size:13px;border-top:1px solid var(--line)}
.m .ticker-l{padding-left:16px;font-size:11px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{height:46px;font-family:var(--fd);font-weight:700;font-size:16px;color:var(--muted)}
.tabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.m-body{flex:1;min-height:0;position:relative}
.m-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,8,.5) 0%,rgba(11,7,8,0) 22%,transparent 46%,rgba(11,7,8,.85) 100%);background:linear-gradient(180deg,rgba(11,7,8,.5) 0%,rgba(11,7,8,0) 22%,transparent 38%,color-mix(in srgb,var(--band,#1C1718) 82%,transparent) 62%,var(--band,#1C1718) 80%);pointer-events:none}
.box{display:inline-flex;align-items:center;background:#0B0708;color:#F5F2F2}
.box.t{margin:0;max-width:100%;padding:2px 10px;font-family:var(--fd);font-weight:900;font-size:24px;line-height:34px;text-transform:uppercase;border-radius:4px 4px 4px 0;white-space:nowrap;overflow:hidden}
.box.p{padding:2px 10px;font-weight:600;font-size:18px;line-height:28px;border-radius:0 4px 4px 4px}
.box.c{margin-top:10px;height:40px;padding:0 14px 0 12px;gap:8px;font-size:15px;font-weight:500;border-radius:4px}
.glass{background:rgba(11,7,8,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(245,242,242,.14);color:#F5F2F2}
.m-time{position:absolute;left:50%;top:34px;transform:translateX(-50%);height:26px;display:inline-flex;align-items:center;background:#0B0708;color:#F5F2F2;font-size:14px;line-height:1;font-weight:600;border-radius:3px;pointer-events:none}
.m-time b{padding:0 8px;font-weight:600}.m-time i{width:1px;height:14px;background:#655B5D}.m-time span{padding:0 8px;color:#B9ADAF}
.buy-pill{position:absolute;left:16px;right:16px;bottom:18px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;background:#F5F2F2;color:#0B0708;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:2}
.m-tap{position:absolute;left:0;right:0;top:190px;bottom:200px;z-index:1}
.m-flash{position:absolute;left:50%;top:44%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;background:rgba(11,7,8,.55);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;z-index:2}
.m-flash.show{opacity:1;transform:scale(1)}
.m-scroll{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding-bottom:100px}
.m-scroll::-webkit-scrollbar{display:none}
.mp-bar{padding:12px 12px 0 16px;display:flex;align-items:center;gap:4px}
.back{width:44px;height:44px;margin-right:auto;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.mp-head{padding:12px 16px 0;display:flex;gap:16px;align-items:center}
.mp-cover{flex:none;border-radius:10px;overflow:hidden}
.mp-head img{display:block;width:132px;height:132px;border-radius:10px;object-fit:cover}
.mp-head h1{margin:0;font-family:var(--fd);font-weight:900;font-size:26px;line-height:32px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip}
.mp-acts{padding:10px 12px 0 6px;display:flex;align-items:center;gap:2px}
.mp-acts>button,.mp-acts>a{height:48px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:600}
.mp-acts .play{margin-left:auto;width:60px;height:60px;padding:0;justify-content:center;border-radius:50%;background:var(--text);color:var(--bg)}
.m .tag{height:28px;padding:0 9px;font-size:14px}
.m .seg4{background:var(--surface);border-radius:13px}
.m .seg4 button{height:44px;font-size:13px;border-radius:10px}
.m .terms div{padding:11px 0;font-size:15px}
.m .lic{padding:0}
.m-list{height:100%;overflow-y:auto;padding-bottom:100px}
.mini{position:absolute;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom) + 8px);height:68px;padding:0 8px;border-radius:34px;display:flex;align-items:center;gap:10px;background:var(--raised-2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.mini .ring{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.mini .ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mini .ring span{width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.m-nav{flex:none;padding-bottom:env(safe-area-inset-bottom);display:grid;grid-template-columns:repeat(5,1fr);background:var(--bg);border-top:1px solid var(--line)}
.m-nav a{height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;line-height:14px;font-weight:600;color:var(--muted)}
.m-nav a.on{color:var(--text)}
/* бегущая строка для длинных названий */
.mq{display:block;overflow:hidden;white-space:nowrap;min-width:0;max-width:100%}
.mq>span{display:inline-block}
.mq.go{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 18px),transparent)}
.mq.go>span{animation:mq var(--t,10s) ease-in-out 1.6s infinite}
.scrolling .mq.go>span{animation:none}
@keyframes mq{0%{transform:translateX(0)}45%,55%{transform:translateX(var(--d,0))}78%,100%{transform:translateX(0)}}
@media (prefers-reduced-motion:reduce){.mq.go>span{animation:none}}
.box.t{display:block;text-align:left}
.icon44.ghost.on{color:var(--text);background:var(--raised-2)}
/* каталог */
.chips{display:flex;gap:6px;padding:14px 16px 0;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips .chip{flex:none;height:36px;padding:0 14px;font-size:14px}
.hot-row{display:flex;gap:12px;overflow-x:auto;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding:0 16px;scrollbar-width:none}
.hot-row::-webkit-scrollbar{display:none}
.hot-card{flex:none;width:236px;scroll-snap-align:start;min-width:0}
.cat-cv{position:relative;border-radius:12px;overflow:hidden}
.cat-open{display:block;width:100%}
.rank{position:absolute;left:12px;top:6px;font-family:var(--fd);font-weight:900;font-size:36px;line-height:44px;color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.55);pointer-events:none}
.cat-play{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 12px;padding:0 16px}
.cat-card{min-width:0}
.cat-t{display:block;width:100%;margin-top:10px;text-align:left;font-family:var(--fd);font-weight:900;font-size:15px;line-height:20px;text-transform:uppercase}
.cat-meta{margin:2px 0 0;font-size:14px;line-height:18px;color:var(--muted)}
.cat-row{margin:8px 0 0;display:flex;align-items:center;justify-content:space-between;gap:6px}
.price{font-family:var(--fd);font-weight:700;font-size:14px;white-space:nowrap}
.mp-t{margin:0;font-family:var(--fd);font-weight:900;font-size:26px;line-height:32px;text-transform:uppercase}
.mini-t{font-family:var(--fd);font-weight:900;font-size:15px;line-height:20px;text-transform:uppercase}
/* полноэкранный плеер */
.pl{position:absolute;inset:0;z-index:30;display:flex;flex-direction:column;background:var(--bg)}
.pl.in{animation:plIn .3s cubic-bezier(.2,.8,.2,1)}
@keyframes plIn{from{transform:translateY(100%)}to{transform:none}}
.pl-card{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:0 0 28px 28px;background:var(--band,#1C1718);color:#F5F2F2}
.pl-pan{position:absolute;left:0;top:0;bottom:0;will-change:transform}
.pl-pan img{display:block;height:100%;width:auto;max-width:none}
.pl-head{position:absolute;left:16px;right:80px;top:calc(env(safe-area-inset-top) + 14px);display:flex;flex-direction:column;align-items:flex-start;z-index:2}
.pl-close{position:absolute;right:16px;top:calc(env(safe-area-inset-top) + 14px);width:50px;height:50px;border-radius:50%;display:grid;place-items:center;z-index:2}
.pl-card .wave{position:absolute;left:0;right:0;bottom:92px;height:91px;z-index:2;overflow:hidden;cursor:grab}
.pl-card .wave.is-drag{cursor:grabbing}
.w-track{position:absolute;left:0;top:0;height:91px;will-change:transform}
.w-track canvas{display:block}
.w-clip{position:absolute;left:0;top:0;height:91px;overflow:hidden}
.pl-card .buy-pill{z-index:3}
.pl-bar{flex:none;display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.pl-bar button{height:52px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:600;border-radius:12px}
.pl-bar button.on{background:var(--raised-2)}
/* фильтры ленты на телефоне */
.f-bar{position:sticky;top:0;z-index:3;background:var(--bg);display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.seg2{display:inline-flex;padding:3px;gap:2px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.seg2 button{height:36px;padding:0 14px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.seg2 button.on{background:var(--text);color:var(--bg)}
.f-btn{margin-left:auto;height:42px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:600}
.f-btn b{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--text);color:var(--bg);font-size:12px;line-height:20px;text-align:center}
.f-scrim{position:fixed;inset:0;z-index:4;cursor:default}
.f-pop{position:absolute;right:16px;top:calc(100% + 6px);z-index:5;width:250px;padding:6px;background:var(--raised-2);border:1px solid var(--line);border-radius:14px;box-shadow:0 12px 32px rgba(0,0,0,.5);display:flex;flex-direction:column}
.f-pop button{height:46px;padding:0 12px;border-radius:10px;display:flex;align-items:center;justify-content:space-between;font-size:15px;font-weight:500}
.f-pop button:hover{background:var(--raised)}
.f-check{width:22px;height:22px;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center}
.f-check.on{background:var(--text);color:var(--bg);border-color:var(--text)}
/* лента на телефоне */
.m .post{padding:16px}
.m .p-head b{font-size:16px}
.m .p-text{font-size:16px;line-height:24px}
.m .p-acts button{height:44px;font-size:15px}
.m .ev{padding:12px 16px;font-size:15px;line-height:21px}
.m .poll button{height:48px;font-size:16px}
.m .poll small{font-size:14px}
.m .att-t{font-size:15px;line-height:20px}
.m .ev .lnk{font-size:14px}
.m .att-top .pl-btn{width:44px;height:44px}
.m .fl-end{padding-bottom:120px}
/* ---------- проверка на своём файле ---------- */
.up{position:fixed;inset:0;z-index:100;background:rgba(11,7,8,.72);display:grid;place-items:center;padding:16px}
.up[hidden]{display:none}
@media (min-width:701px){.up-box{zoom:.85}}
.up-box{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.up-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.up-head h2{margin:0;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px}

.up-field input{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);font-size:16px;text-transform:uppercase}
.up-go:disabled{opacity:.4;cursor:default}

/* ===== рендер ===== */

  document.getElementById('app').innerHTML = mq.matches ? mobileHTML() : desktopHTML();
  if (render.keep) SCROLLERS.forEach(function (s) { var el = document.querySelector(s); if (el && keep[s] != null) el.scrollTop = keep[s]; });
  render.keep = true;
  st.plAnim = false;

}
function fitDesk() { var d = document.querySelector('.d'); if (d) d.style.height = (window.innerHeight / DZ) + 'px'; }

var rT, wasWide = wide();

/* ===== адреса: #/ главная, #/beat/id страница бита ===== */
function parseRoute() {
  var m = /^#\/beat\/([\w-]+)/.exec(location.hash);
  return m && BY[m[1]] ? { view: 'beat', page: m[1] } : { view: 'home' };
}
function applyRoute(opts) {
  opts = opts || {};
  var r = parseRoute(), changed = r.view !== st.view || (r.view === 'beat' && r.page !== st.page);
  if (mq.matches) {
    if (r.view === 'beat') { st.page = r.page; st.mTab = 'beats'; st.mView = 'page'; st.player = false; }
    st.view = r.view;
    if (changed || opts.force) fresh();
    return;
  }
  if (changed || opts.force) {
    var main = document.querySelector('.d-main');
    if (st.view === 'home' && main) st.homeScroll = main.scrollTop;
    st.view = r.view; if (r.page) st.page = r.page;
    st.feed = false; st.gOpen = false; st.fOpen = false;
    fresh();
    if (st.view === 'home' && !opts.scroll) { var m2 = document.querySelector('.d-main'); if (m2) m2.scrollTop = st.homeScroll; }
  }
  if (opts.scroll) { var t = document.getElementById(opts.scroll); if (t) t.scrollIntoView({ behavior: changed ? 'auto' : 'smooth', block: 'start' }); }
}
function go(view, id, opts) {
  var url = view === 'beat' ? '#/beat/' + id : '#/';
  if (location.hash !== url) { try { history.pushState(null, '', url); } catch (e) { location.hash = url; return; } }
  applyRoute(opts);
}
window.addEventListener('popstate', function () { applyRoute(); });
window.addEventListener('hashchange', function () { applyRoute(); });

/* ===== действия ===== */
function startBeat(id) { if (st.playing !== id) { st.playing = id; st.pos = 0; } st.paused = false; st.started = true; syncAudio(); }
function flash(el) {
  var fl = el.parentNode.querySelector('.m-flash');
  if (!fl) return;
  fl.innerHTML = ic(st.paused ? 'pause' : 'play', 34); fl.classList.add('show');
  clearTimeout(fl._t); fl._t = setTimeout(function () { fl.classList.remove('show'); }, 600);
}
function scrollToId(id, smooth) {
  var t = document.getElementById(id), sc = document.getElementById('mscroll');
  if (!t) return;
  if (sc && sc.contains(t)) {
    var top = t.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - 8;
    sc.scrollTo({ top: top, behavior: smooth ? 'smooth' : 'auto' });
  } else t.scrollIntoView({ behavior: smooth ? 'smooth' : 'auto', block: 'start' });
}
function gridChanged() { st.gMore = 0; rerenderKeep(); }

var up = { cover: null, band: null, peaks: null, dur: 0, audio: null };
var upEl = document.getElementById('up'), upBox = document.getElementById('up-box'), lastFocus = null;
var PH = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600"><defs><radialGradient id="g" cx=".25" cy=".85" r="1"><stop offset="0" stop-color="#4A4446"/><stop offset="1" stop-color="#141011"/></radialGradient></defs><rect width="600" height="600" fill="url(#g)"/><text x="40" y="548" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="66" fill="#F3EFEF">ТВОЙ БИТ</text></svg>');
function openUp() { lastFocus = document.activeElement; upEl.hidden = false; document.getElementById('up-x').focus(); }
function closeUp() { upEl.hidden = true; upBox.classList.remove('is-drag'); if (lastFocus && lastFocus.focus) lastFocus.focus(); }
document.getElementById('up-x').addEventListener('click', closeUp);
upEl.addEventListener('click', function (e) { if (e.target === upEl) closeUp(); });
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !upEl.hidden) closeUp(); });
function upReady() { document.getElementById('up-go').disabled = !(up.cover || up.peaks); }
function takeCover(file) {
  if (!file || !/^image\//.test(file.type)) return;
  var url = URL.createObjectURL(file), img = new Image(), stc = document.getElementById('up-cover-st');
  img.onload = function () {
    var c = null;
    try { c = keyColor(img); } catch (e) { c = null; }
    up.cover = url; up.band = c || ['#262022', '#171314'];
    document.getElementById('up-thumb').innerHTML = '<img src="' + url + '" alt="">';
    stc.textContent = c ? file.name : file.name + ': почти без цвета, полоса будет серой';
    document.getElementById('up-sw').hidden = false;
    document.getElementById('up-sw-i').style.background = 'linear-gradient(110deg,' + up.band[1] + ',' + up.band[0] + ')';
    upReady();
  };
  img.onerror = function () { stc.textContent = 'Не получилось открыть картинку'; };
  img.src = url;
}
/* те же пики, что считались для макетов: max|x| и RMS по окну, 720 точек */
function peaksFrom(ab) {
  var N = 720, len = ab.length, ch = Math.min(2, ab.numberOfChannels), data = [], vals = [], top = 0;
  for (var c = 0; c < ch; c++) data.push(ab.getChannelData(c));
  var win = Math.max(1, Math.floor(len / N));
  for (var i = 0; i < N; i++) {
    var pk = 0, sq = 0, a = i * win, e = Math.min(len, a + win), n = 0;
    for (var j = a; j < e; j++) {
      var sm = data[0][j]; if (ch > 1) sm = (sm + data[1][j]) / 2;
      var av = sm < 0 ? -sm : sm; if (av > pk) pk = av; sq += sm * sm; n++;
    }
    var v = 0.45 * pk + 0.55 * Math.sqrt(sq / Math.max(1, n)) * 1.9;
    vals.push(v); if (v > top) top = v;
  }
  return vals.map(function (v) { return Math.pow(Math.max(0.04, v / (top || 1)), 0.72); });
}
var actx = null;
function takeAudio(file) {
  if (!file) return;
  var sta = document.getElementById('up-audio-st'), title = document.getElementById('up-title');
  sta.textContent = 'Считаю волну…';
  if (!title.value) title.value = file.name.replace(/\.[^.]+$/, '').toUpperCase().slice(0, 40);
  var read = file.arrayBuffer ? file.arrayBuffer() : new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = no; r.readAsArrayBuffer(file); });
  read.then(function (buf) {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    return new Promise(function (ok, no) { actx.decodeAudioData(buf, ok, no); });
  }).then(function (ab) {
    up.peaks = peaksFrom(ab); up.dur = ab.duration; up.audio = URL.createObjectURL(file);
    sta.textContent = file.name + ', ' + fmt(ab.duration) + ', волна готова';
    upReady();
  }).catch(function () { sta.textContent = 'Не получилось прочитать файл. Попробуй MP3 или WAV.'; });
}
function takeFiles(fs) {
  for (var i = 0; i < fs.length; i++) {
    var f = fs[i];
    if (/^image\//.test(f.type)) takeCover(f);
    else if (/^audio\//.test(f.type) || /\.(mp3|wav|m4a|flac|ogg|aac)$/i.test(f.name)) takeAudio(f);
  }
}
document.getElementById('up-cover').addEventListener('change', function (e) { if (e.target.files[0]) takeCover(e.target.files[0]); e.target.value = ''; });
document.getElementById('up-audio').addEventListener('change', function (e) { if (e.target.files[0]) takeAudio(e.target.files[0]); e.target.value = ''; });
['dragenter', 'dragover'].forEach(function (ev) { upEl.addEventListener(ev, function (e) { e.preventDefault(); upBox.classList.add('is-drag'); }); });
upEl.addEventListener('dragleave', function (e) { if (!upEl.contains(e.relatedTarget)) upBox.classList.remove('is-drag'); });
upEl.addEventListener('drop', function (e) { e.preventDefault(); upBox.classList.remove('is-drag'); if (e.dataTransfer && e.dataTransfer.files) takeFiles(e.dataTransfer.files); });
document.addEventListener('dragover', function (e) {
  var types = e.dataTransfer && e.dataTransfer.types;
  if (upEl.hidden && types && Array.prototype.indexOf.call(types, 'Files') >= 0) { e.preventDefault(); openUp(); }
});
document.getElementById('up-go').addEventListener('click', function () {
  var old = BY.custom, hasAudio = !!up.peaks;
  var title = (document.getElementById('up-title').value || 'МОЙ БИТ').trim().toUpperCase().slice(0, 40) || 'МОЙ БИТ';
  var b = {
    id: 'custom', ver: (old ? old.ver || 0 : 0) + 1, title: title, producer: 'ты', bpm: 0, key: '', genre: 'твой бит', rub: 1990,
    dur: hasAudio ? up.dur : 150, seed: 7, peaks: hasAudio ? up.peaks : null, audio: hasAudio ? up.audio : null,
    ago: 'только что', date: 'сегодня', hrs: 0, likes: 0, comments: 0, reposts: 0, plays: '0', bought: '0 раз',
    genres: ['твой бит'], moods: ['не указано'],
    desc: (hasAudio ? 'Волна посчитана из твоего файла прямо в браузере, звук настоящий.' : 'Звука нет, поэтому волна и проигрывание тут для примера.') + (up.cover ? ' Цвет полосы взят из обложки.' : ''),
    cover: up.cover || (old ? old.cover : PH),
    band: up.cover ? up.band[0] : (old ? old.band : '#262022'), band2: up.cover ? up.band[1] : (old ? old.band2 : '#171314')
  };
  if (old) BEATS[BEATS.indexOf(old)] = b; else BEATS.unshift(b);
  BY.custom = b;
  if (!aud) {
    aud = new Audio(); aud.preload = 'auto';
    aud.addEventListener('ended', function () { st.paused = true; st.pos = 0; syncPlayButtons(); tickUI(); });
  }
  st.playing = 'custom'; st.pos = 0; st.paused = false; st.feed = false; st.started = true;
  syncAudio();
  closeUp();
  if (mq.matches) { st.page = 'custom'; st.mTab = 'beats'; st.mView = 'catalog'; st.player = true; st.plAnim = true; fresh(); }
  else go('beat', 'custom', { force: true });
});

(function () {
  var r = parseRoute();
  st.view = r.view;
  if (r.view === 'beat') { st.page = st.playing = r.page; if (mq.matches) { st.mTab = 'beats'; st.mView = 'page'; } }
  wasWide = wide();
  render.keep = false;
  render();
})();
})();
</script>
