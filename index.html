<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0708">
<title>basswerk: прототип</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0B0708;--surface:#141011;--raised:#1C1718;--raised-2:#2A2325;--line:#2F2829;--line-strong:#655B5D;--text:#F3EFEF;--muted:#9C9092;--ok:#2DB36F;--fd:Unbounded,"Arial Black",system-ui,sans-serif;--fs:Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fs);font-size:16px;line-height:24px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
svg.i{display:block;flex:none}
.av{display:grid;place-items:center;border-radius:50%;flex:none;font-family:var(--fd);font-weight:900;color:#F3EFEF;background:radial-gradient(120% 120% at 20% 100%,#5A4146,#1C1718 70%)}
.tag{flex:none;height:24px;padding:0 7px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-size:13px;font-weight:500;line-height:1;white-space:nowrap}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn-fill{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-fill:hover{opacity:.92}
.ghost{color:var(--muted);border-radius:8px}
.ghost:hover{color:var(--text);background:var(--surface)}
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#1C1718}

/* ---------- волна ---------- */
.wave{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wave canvas{display:block;width:100%;height:100%}
.w-line{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,255,255,.85);pointer-events:none;opacity:0}
.w-tip{position:absolute;top:-30px;transform:translateX(-50%);height:22px;padding:0 7px;display:inline-flex;align-items:center;border-radius:4px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;line-height:1;font-weight:600;pointer-events:none;white-space:nowrap;opacity:0}
.wave.is-hover .w-line,.wave.is-hover .w-tip{opacity:1}

/* ---------- десктоп ---------- */
/* масштаб десктопа: до 1080p включительно 80%, на 1440p / 4K / ультрашироких чуть крупнее.
   --dz считает applyDZ(), высоту подгоняет fitDesk().
   --cap: шире этого каркас не растягивается (только 32:9 и шире), дальше центрируется */
:root{--dz:.8;--cap:3840px}
.d{zoom:var(--dz);height:calc(100vh / var(--dz));display:flex;flex-direction:column;overflow:hidden}
.d-head{flex:none;border-bottom:1px solid var(--line)}
.d-head-in{max-width:var(--cap);margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.d-logo img{height:36px;width:auto;display:block}
.d-search{flex:1 1 320px;max-width:760px;position:relative;display:flex;align-items:center}
.d-search input{width:100%;height:44px;padding:0 16px 0 42px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.d-search input::placeholder{color:var(--muted)}
.d-search svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.d-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon44{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.icon44:hover{background:var(--surface)}
.ticker{flex:none;height:36px;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line);font-size:13px;line-height:16px;display:flex;align-items:center}
.ticker-l{flex:none;padding:0 16px 0 24px;display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.06em;background:var(--surface);position:relative;z-index:1;height:100%}
.ticker-l i{width:7px;height:7px;border-radius:50%;background:var(--text)}
.ticker-run{display:flex;gap:28px;white-space:nowrap;animation:run 60s linear infinite;padding-right:28px}
.ticker-run span{display:inline-flex;gap:8px}
.ticker-run b{font-weight:700}.ticker-run .plus{color:var(--ok)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-run{animation:none}}
/* overflow:clip, чтобы спрятанная лента (.drawer) не вылезала в поля по бокам на широких экранах;
   тени по краям видны только когда каркас уже упёрся в --cap */
.d-shell{flex:1;min-height:0;display:flex;position:relative;max-width:var(--cap);width:100%;margin:0 auto;overflow:hidden;overflow:clip;box-shadow:-1px 0 0 var(--line),1px 0 0 var(--line)}
.strip{width:88px;flex:none;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.strip-top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:11px;letter-spacing:.06em;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.strip ol{list-style:none;margin:0;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:16px}
.strip li button{width:76px;display:flex;flex-direction:column;align-items:center;gap:8px}
.strip .ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line-strong)}
.strip .ring.sale{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ok)}
.strip .ring.beat{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.strip small{font-family:var(--fd);font-weight:700;font-size:11px;line-height:14px;white-space:nowrap;color:var(--muted)}
.strip small.sale{color:var(--ok)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:clamp(420px,30cqw,580px);background:var(--bg);border-right:1px solid var(--line);z-index:30;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-102%);visibility:hidden;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s linear .28s;box-shadow:24px 0 48px rgba(0,0,0,.5)}
.scrim{position:absolute;inset:0;z-index:25;background:rgba(11,7,8,.62);opacity:0;pointer-events:none;transition:opacity .28s}
.is-feed .drawer{transform:none;visibility:visible;transition:transform .28s cubic-bezier(.2,.8,.2,1),visibility 0s}
.is-feed .scrim{opacity:1;pointer-events:auto}
.is-feed .d-main{overflow:hidden}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.d-main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;container-type:inline-size}
.page{max-width:1640px;margin:0 auto;padding:20px 32px 64px}
.hero{border-radius:20px;color:#F5F2F2;background:linear-gradient(110deg,var(--band2,#1B1718) 0%,var(--band,#2A2325) 62%);transition:background .5s ease}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;padding:32px}
.hero-l{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero-top{display:flex;gap:24px;align-items:flex-start}
.h-play{width:72px;height:72px;flex:none;margin-top:6px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center}
.h-play:hover{transform:scale(1.04)}
.h-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.06em;color:rgba(245,242,242,.75)}
.h-badge b{height:20px;padding:0 6px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.5);border-radius:4px;color:#F5F2F2}
.h-title{margin:6px 0 0;font-family:var(--fd);font-weight:900;font-size:56px;line-height:60px;letter-spacing:-.015em;text-transform:uppercase;overflow-wrap:break-word;text-wrap:balance}
.h-title.l{font-size:44px;line-height:48px}.h-title.xl{font-size:36px;line-height:40px}
.h-meta{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:16px;line-height:22px;color:rgba(245,242,242,.75)}
.h-meta a{color:#F5F2F2;font-weight:600}
.h-tag{height:26px;padding:0 8px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.32);border-radius:4px;font-size:13px;font-weight:500;color:rgba(245,242,242,.9)}
.hero .wave{height:151px;margin-right:60px;cursor:pointer}
.hero .w-now,.hero .w-dur{position:absolute;right:-60px;width:52px;text-align:right;font-size:13px;line-height:18px}
.hero .w-now{top:68px;font-weight:700;color:#fff}
.hero .w-dur{top:95px;color:rgba(245,242,242,.62)}
.h-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-btn{height:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(0,0,0,.16);border:1px solid rgba(245,242,242,.26);color:#F5F2F2}
.h-btn:hover{background:rgba(0,0,0,.3);border-color:rgba(245,242,242,.6)}
.h-btn.on{background:#F5F2F2;color:#0B0708;border-color:#F5F2F2}
.h-btn.round{width:44px;padding:0;justify-content:center}
.h-buy{margin-left:auto;height:48px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;background:#F5F2F2;color:#0B0708;font-size:15px;font-weight:700;white-space:nowrap}
.h-buy:hover{background:#fff}
.hero-cover{border-radius:12px;box-shadow:0 20px 56px rgba(0,0,0,.4)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start;margin-top:28px}
.sec-h{margin:0;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.facts{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px}
.facts div{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.facts dt{font-size:14px;line-height:18px;color:var(--muted)}
.facts dd{margin:4px 0 0;font-weight:600;font-size:16px;line-height:22px;display:flex;flex-wrap:wrap;gap:4px}
.comments{list-style:none;margin:0;padding:0}
.comments li{padding:16px 0;border-bottom:1px solid var(--line)}
.c-row{display:flex;gap:12px}
.c-head{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:14px;color:var(--muted)}
.c-head b{font-weight:600;font-size:15px;color:var(--text)}
.c-text{margin:4px 0 0;font-size:15px;line-height:22px}
.c-acts{margin:6px 0 0 -10px;display:flex;gap:2px}
.c-acts button{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.author{height:18px;padding:0 5px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.06em;color:var(--text);align-self:center}
.lic{padding:20px;display:flex;flex-direction:column}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.seg4 button{height:34px;border-radius:9px;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg4 button:hover{color:var(--text)}
.seg4 button.on{background:var(--raised-2);color:var(--text)}
.terms{margin:6px 0 0;display:flex;flex-direction:column}
.terms div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.terms dt{color:var(--muted)}.terms dd{margin:0;text-align:right;font-weight:500}
.note{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;font-size:14px;line-height:19px;color:var(--muted)}
.note a{text-decoration:underline;text-underline-offset:2px}
.more-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.more-row:hover{background:var(--raised)}
.more-row .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.more-row img{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.pl-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center}
.pl-btn:hover{border-color:var(--text)}
.d-player{flex:none;background:var(--raised);border-top:1px solid var(--line)}
.d-player-in{max-width:var(--cap);margin:0 auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:16px}
.d-player img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.pp{width:44px;height:44px;flex:none;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.prog{flex:1;max-width:560px;height:4px;border-radius:999px;background:var(--line);overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;background:var(--text);width:0}
@container (max-width:1240px){.cols{grid-template-columns:minmax(0,1fr) 360px}.hero-grid{grid-template-columns:minmax(0,1fr) 340px;gap:36px}}
@container (max-width:1020px){.cols{grid-template-columns:minmax(0,1fr)}.side{order:-1}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-grid{grid-template-columns:minmax(0,1fr) 240px;gap:28px;padding:24px}.h-title{font-size:40px;line-height:44px}}
@container (max-width:720px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-cover{display:none}}

/* ---------- лента (колонка на главной и выезжающая панель) ---------- */
.fp-head{position:sticky;top:0;z-index:4;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px 12px;display:flex;flex-direction:column;gap:10px}
.fp-row{display:flex;align-items:center;gap:8px}
.fp-head h2{margin:0;font-family:var(--fd);font-weight:700;font-size:22px;line-height:28px}
.fp-head .f-pop{right:0}
.composer{margin:0;padding:16px 20px;display:flex;gap:12px;border-bottom:1px solid var(--line)}
.composer input{width:100%;height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.composer input::placeholder{color:var(--muted)}
.cmp-row{margin-top:10px;display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.cmp-att{height:36px;padding:0 8px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);border:1px solid transparent}
.cmp-att:hover{color:var(--text);background:var(--surface)}
.cmp-att.on{color:var(--text);border-color:var(--line-strong);background:var(--surface)}
.cmp-go{margin-left:auto;height:36px;padding:0 14px;border-radius:999px;font-size:13px}
.cmp-hint{margin:8px 0 0;font-size:13px;line-height:18px;color:var(--muted)}
.fl{list-style:none;margin:0;padding:0}
.fl-end{margin:0;padding:24px 20px 40px;text-align:center;font-size:13px;color:var(--muted)}
.post{padding:16px 20px;border-bottom:1px solid var(--line)}
.p-head{display:flex;align-items:center;gap:12px}
.p-head b{display:block;font-weight:600;font-size:15px;line-height:20px}
.p-head small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.p-head .icon44{width:36px;height:36px;margin-right:-8px}
.p-text{margin:10px 0 0;font-size:15px;line-height:22px}
.p-img{display:block;width:100%;margin-top:12px;border-radius:12px;overflow:hidden}
.p-img img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.att{margin-top:12px;display:flex;gap:12px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.att-cv{flex:none}
.att-cv img{display:block;width:84px;height:84px;border-radius:8px;object-fit:cover}
.att-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:8px}
.att-top{display:flex;align-items:center;gap:10px}
.att-top .pl-btn{width:36px;height:36px}
.att-t{display:block;max-width:100%;text-align:left;font-family:var(--fd);font-weight:900;font-size:14px;line-height:18px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.att-t:hover{text-decoration:underline}
.att-s{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.att-price{flex:none;font-family:var(--fd);font-weight:700;font-size:13px;white-space:nowrap}
.att .wave{height:33px;cursor:pointer}
.p-acts{margin:8px 0 0 -10px;display:flex;gap:2px}
.p-acts button{height:36px;padding:0 10px;border-radius:8px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
.p-acts button:hover{color:var(--text);background:var(--surface)}
.p-acts button.on{color:var(--text)}
.poll{margin-top:12px;display:flex;flex-direction:column;gap:6px}
.poll button{position:relative;height:42px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;font-weight:600;overflow:hidden;text-align:left}
.poll button:hover{border-color:var(--text)}
.poll.done button{border-color:var(--line)}
.poll i{position:absolute;left:0;top:0;bottom:0;background:var(--raised-2);transition:width .4s ease}
.poll button.me i{background:#463C3E}
.poll span,.poll b{position:relative;display:inline-flex;align-items:center;gap:6px}
.poll small{font-size:13px;line-height:18px;color:var(--muted)}
.ev{display:flex;align-items:center;gap:12px;padding:12px 20px;border-bottom:1px solid var(--line);font-size:14px;line-height:20px}
.ev-av{position:relative;flex:none}
.ev-av i{position:absolute;right:-5px;bottom:-5px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--raised-2);border:2px solid var(--bg);color:var(--text)}
.ev-av i.sale{background:var(--ok);color:#0B0708}
.ev p{margin:0;flex:1;min-width:0}
.ev p b{font-weight:600}
.ev .lnk{font-family:var(--fd);font-weight:800;font-size:12px;letter-spacing:.02em;text-transform:uppercase}
.ev button.lnk:hover{text-decoration:underline}
.ev small{display:block;color:var(--muted);font-size:12px;line-height:16px}
.ev-amt{flex:none;font-weight:700;color:var(--ok);font-size:14px;white-space:nowrap}
.ev-cv{flex:none}
.ev-cv img{display:block;width:44px;height:44px;border-radius:6px;object-fit:cover}
.d-shell{container-type:inline-size}
.dock{width:clamp(440px,28cqw,560px);flex:none;border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.strip .ring.repost{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line-strong)}
.ticker-run button{font:inherit;font-weight:500}
.ticker-run button:hover{text-decoration:underline;text-underline-offset:2px}
.ticker:hover .ticker-run{animation-play-state:paused}
.lic-price{margin:18px 0 0;font-family:var(--fd);font-weight:900;font-size:36px;line-height:42px;letter-spacing:-.01em;white-space:nowrap}
.tag.sm{height:22px;font-size:12px;padding:0 6px}
.tag.md{height:26px;font-size:13px}
.tag.xs{height:18px;font-size:12px;padding:0 5px}

/* ---------- главная: топ ---------- */
.home{max-width:1640px;margin:0 auto;padding:22px 32px 48px}
.top-head{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.ttabs{display:flex;gap:4px;margin-left:-12px}
.ttabs button{height:44px;padding:0 12px;border-radius:10px;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px;color:var(--muted)}
.ttabs button:hover{color:var(--text)}
.ttabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text);border-radius:0}
.top-head .seg2{margin-left:auto}

.m .fl-end{padding-bottom:120px}
/* ---------- проверка на своём файле ---------- */
.up{position:fixed;inset:0;z-index:100;background:rgba(11,7,8,.72);display:grid;place-items:center;padding:16px}
.up[hidden]{display:none}
@media (min-width:701px){.up-box{zoom:calc(var(--dz) * 1.0625)}}
.up-box{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px}
.up-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.up-head h2{margin:0;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px}
.up-drop{display:flex;align-items:center;gap:14px;padding:12px;border:1px dashed var(--line-strong);border-radius:14px;cursor:pointer;min-height:78px}
.up-drop:hover,.up-box.is-drag .up-drop{border-color:var(--text);background:var(--raised)}
.sr:focus-visible+.up-drop{outline:2px solid var(--text);outline-offset:2px}
.up-thumb{width:52px;height:52px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--raised-2);overflow:hidden}
.up-thumb img{width:100%;height:100%;object-fit:cover}
.up-drop b{display:block;font-weight:600}
.up-drop small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.up-sw{margin-left:auto;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;line-height:14px;color:var(--muted);text-align:center}
.up-sw i{width:34px;height:34px;border-radius:50%;border:1px solid var(--line-strong)}
.up-field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.up-field input{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);font-size:16px;text-transform:uppercase}
.up-go:disabled{opacity:.4;cursor:default}
@media (max-width:700px){.up{place-items:end center;padding:0}.up-box{border-radius:20px 20px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))}}

/* ---------- меню профиля ---------- */
.d-head{position:relative;z-index:50}
.pm-wrap{position:relative}
.pm-btn{height:44px;padding:0 8px 0 0;border-radius:999px;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.pm-btn:hover,.pm-btn[aria-expanded=true]{color:var(--text);background:var(--surface)}
.pm-scrim{position:fixed;inset:0;z-index:1;cursor:default}
.pm{position:absolute;right:0;top:calc(100% + 8px);z-index:2;width:304px;padding:8px;background:var(--raised-2);border:1px solid var(--line);border-radius:16px;box-shadow:0 16px 40px rgba(0,0,0,.55);display:flex;flex-direction:column}
.pm-me{display:flex;align-items:center;gap:12px;padding:8px;border-radius:10px;text-align:left;width:100%}
.pm-me:hover{background:var(--raised)}
.pm-me b{display:block;font-weight:700;font-size:16px;line-height:22px}
.pm-me small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.pm-up{margin:6px 0 4px;height:44px;border-radius:10px;background:var(--text);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;width:100%}
.pm-up:hover{opacity:.92}
.pm-i{height:44px;padding:0 10px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:500;width:100%;text-align:left;color:var(--text)}
.pm-i:hover{background:var(--raised)}
.pm-i svg{color:var(--muted)}
.pm-i .n{margin-left:auto;font-size:13px;color:var(--muted)}
.pm-sep{height:1px;margin:6px 4px;background:var(--line)}
.pm-sheet-scrim{position:absolute;inset:0;z-index:40;background:rgba(11,7,8,.62)}
.pm-sheet{position:absolute;left:0;right:0;bottom:0;z-index:41;padding:8px 12px calc(12px + env(safe-area-inset-bottom));background:var(--raised-2);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);animation:plIn .25s cubic-bezier(.2,.8,.2,1)}
.pm-sheet::before{content:"";display:block;width:40px;height:5px;margin:2px auto 8px;border-radius:999px;background:var(--line-strong)}
.pm-sheet .pm-i{height:52px;font-size:17px}
.pm-sheet .pm-up{height:52px;font-size:16px;border-radius:12px}
.pm-sheet .pm-me b{font-size:18px}
.toast{position:fixed;left:50%;bottom:110px;z-index:200;max-width:calc(100% - 32px);padding:12px 16px;border-radius:12px;background:var(--text);color:var(--bg);font-size:15px;line-height:20px;font-weight:600;opacity:0;transform:translate(-50%,12px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.pv-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px;padding:12px 16px;border:1px dashed var(--line-strong);border-radius:14px;font-size:15px;line-height:20px}
.pv-bar svg{color:var(--muted)}
.pv-bar .btn{margin-left:auto}

/* ---------- студия: каркас ---------- */
.st-shell{display:flex}
.st-nav{width:240px;flex:none;border-right:1px solid var(--line);overflow-y:auto}
.st-nav-in{padding:20px 12px;display:flex;flex-direction:column;gap:4px}
.st-me{display:flex;align-items:center;gap:12px;padding:4px 12px 16px;margin-bottom:8px;border-bottom:1px solid var(--line)}
.st-me b{display:block;font-weight:600;font-size:15px;line-height:20px}
.st-me small{display:block;font-family:var(--fd);font-weight:700;font-size:10px;line-height:14px;letter-spacing:.06em;color:var(--muted)}
.st-link{height:44px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:12px;font-size:15px;font-weight:600;color:var(--muted);white-space:nowrap;width:100%;text-align:left}
.st-link:hover{color:var(--text);background:var(--surface)}
.st-link.on{color:var(--text);background:var(--raised-2)}
.st-link .n{margin-left:auto;font-size:13px;font-weight:500;color:var(--muted)}
.st-sep{height:1px;margin:8px 0;background:var(--line)}
.st-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.st-back{width:44px;height:44px;flex:none;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line-strong)}
.st-back:hover{border-color:var(--text)}
.st-h{margin:0;font-family:var(--fd);font-weight:700;font-size:22px;line-height:28px}
.st-crumb{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.st-acts{margin-left:auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.st-note{display:inline-flex;align-items:center;gap:8px;margin-right:8px;font-size:14px;line-height:20px;color:var(--muted)}
.st-note.ok svg{color:var(--ok)}
.btn[aria-disabled=true]{opacity:.38;cursor:default}
.btn[aria-disabled=true]:hover{border-color:var(--line-strong)}
.btn-fill[aria-disabled=true]:hover{border-color:var(--text);opacity:.38}

/* ---------- студия: шапка бита в режиме правки (общая для десктопа и телефона) ---------- */
.h-play[disabled]{background:rgba(245,242,242,.1);color:rgba(245,242,242,.38);cursor:default;transform:none}
.t-row{margin-top:6px;display:flex;align-items:flex-end;gap:14px}
.t-in{flex:1;min-width:0;width:100%;margin:0;padding:0 0 6px;border:0;border-bottom:2px dashed rgba(245,242,242,.26);border-radius:0;background:none;color:#F5F2F2;font-family:var(--fd);font-weight:900;font-size:56px;line-height:60px;letter-spacing:-.015em;text-transform:uppercase;outline:0}
.t-in::placeholder{color:rgba(245,242,242,.3)}
.t-in:hover{border-bottom-color:rgba(245,242,242,.5)}
.t-in:focus{border-bottom-style:solid;border-bottom-color:#F5F2F2}
.t-cnt{flex:none;padding-bottom:10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:rgba(245,242,242,.55)}
.h-tags{display:inline-flex;gap:6px;flex-wrap:wrap}
button.h-tag{gap:4px;cursor:pointer}
button.h-tag:hover{border-color:#F5F2F2}
.h-tag.add{border-style:dashed;color:rgba(245,242,242,.6)}
.h-tag.add:hover{color:#F5F2F2}
.sh .js-swave{display:block;padding:0;text-align:left}
.sh .drop{cursor:pointer}
.sh .drop::after{content:"";position:absolute;inset:-12px -14px;border:1.5px dashed transparent;border-radius:14px;transition:border-color .15s,background .15s;pointer-events:none}
.sh .drop:hover::after,.sh.is-drag .drop::after{border-color:rgba(245,242,242,.4);background:rgba(245,242,242,.04)}
.sh .st-line{opacity:1;width:2px;margin-left:-1px;background:#F5F2F2;border-radius:2px}
.h-hint{font-size:14px;line-height:20px;color:rgba(245,242,242,.62)}
.h-buy.ph{background:none;border:1.5px dashed rgba(245,242,242,.3);color:rgba(245,242,242,.5);cursor:default}
.file-chip{height:44px;max-width:100%;padding:0 16px 0 12px;border-radius:999px;display:inline-flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border:1px solid rgba(245,242,242,.2);font-size:14px;line-height:1;white-space:nowrap;min-width:0}
.file-chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;min-width:0}
.file-chip span{color:rgba(245,242,242,.62)}
.file-chip .ok{color:#7BE0A8}
.up-bar{width:120px;height:4px;flex:none;border-radius:999px;background:rgba(245,242,242,.2);overflow:hidden}
.up-bar i{display:block;height:100%;width:0;background:#F5F2F2;border-radius:999px}
.cv-ph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;aspect-ratio:1;border-radius:12px;background:rgba(245,242,242,.06);border:1.5px dashed rgba(245,242,242,.24);color:rgba(245,242,242,.8);cursor:pointer;text-align:center;padding:24px}
.cv-ph:hover,.sh.is-drag .cv-ph{background:rgba(245,242,242,.1);border-color:rgba(245,242,242,.55)}
.cv-ic{position:relative;width:104px;height:104px;border-radius:50%;display:grid;place-items:center;background:rgba(245,242,242,.08);color:rgba(245,242,242,.7)}
.cv-plus{position:absolute;right:0;bottom:2px;width:36px;height:36px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center;box-shadow:0 0 0 4px #2A2325}
.cv-ph b{display:block;font-size:16px;line-height:22px;font-weight:600;color:#F5F2F2}
.cv-ph small{display:block;margin-top:2px;font-size:13px;line-height:18px;color:rgba(245,242,242,.55)}
.cv-wrap{position:relative;align-self:start}
.cv-wrap img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;box-shadow:0 20px 56px rgba(0,0,0,.4)}
.cv-tools{position:absolute;left:12px;right:12px;bottom:12px;display:flex;justify-content:space-between;gap:8px}
.gl-btn{height:40px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:#F5F2F2;background:rgba(11,7,8,.58);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(245,242,242,.18);white-space:nowrap}
button.gl-btn:hover{background:rgba(11,7,8,.78)}
.swatch{width:16px;height:16px;border-radius:50%;box-shadow:0 0 0 1.5px rgba(245,242,242,.85)}
.cv-err{position:absolute;inset:0;border-radius:12px;background:rgba(58,6,11,.74);border:1.5px dashed rgba(255,91,82,.6);display:grid;place-items:center}

/* ошибка загрузки: всё серое становится красным */
.sh.err .t-in{border-bottom-color:rgba(255,214,211,.3)}
.sh.err .t-in::placeholder{color:rgba(255,214,211,.32)}
.sh.err .h-play[disabled]{background:rgba(255,91,82,.14);color:rgba(255,160,154,.55)}
.sh.err .h-tag.add{border-color:rgba(255,190,186,.4);color:rgba(255,214,211,.7)}
.sh.err .w-now{color:#FFB3AE}.sh.err .w-dur{color:rgba(255,214,211,.6)}
.err-msg{display:flex;align-items:center;gap:12px;min-width:0}
.err-msg>svg{color:#FF7A72}
.err-msg b{display:block;font-weight:600;font-size:15px;line-height:20px;color:#fff;overflow-wrap:anywhere}
.err-msg span{display:block;font-size:14px;line-height:20px;color:rgba(255,226,224,.8)}
.h-btn.on.err{background:#fff;border-color:#fff}
.cv-ph.err{background:rgba(255,91,82,.1);border-color:rgba(255,91,82,.55)}
.cv-ph.err small{color:rgba(255,214,211,.7)}
.cv-ic.err{background:rgba(255,91,82,.18);color:#FF6B62}
.h-note{display:flex;align-items:center;gap:8px;font-size:14px;line-height:20px;color:rgba(245,242,242,.78)}
.h-actions .h-note{order:10;flex-basis:100%}
.h-note svg{color:#FF7A72}

/* ---------- студия: поля ниже шапки ---------- */
.ab{padding:20px;display:flex;flex-direction:column;gap:12px}
.ab-head{display:flex;align-items:center;gap:10px}
.ab-head b{font-weight:600;font-size:15px}
.ab-head .h-badge{color:var(--muted)}
.ta{display:block;width:100%;min-height:132px;resize:vertical;padding:12px 14px;border-radius:10px;border:1px solid var(--line-strong);background:var(--bg);color:var(--text);font:inherit;font-size:16px;line-height:26px;outline:0}
.ta::placeholder{color:var(--muted)}
.ta:focus{border-color:var(--text)}
.ta-foot{display:flex;justify-content:space-between;gap:12px;font-size:13px;line-height:18px;color:var(--muted)}
.fx-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px}
.fx{min-width:0;padding:14px 0 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fx.w2{grid-column:span 2}
.fx-l{display:flex;align-items:center;gap:8px;font-size:14px;line-height:18px;color:var(--muted)}
.auto{height:18px;padding:0 5px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.06em;color:var(--text)}
.ctl{position:relative;display:flex;align-items:center;height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface)}
.ctl:focus-within{border-color:var(--text)}
.ctl input,.ctl select{appearance:none;-webkit-appearance:none;flex:1;min-width:0;height:100%;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--text);font:inherit;font-size:16px;font-weight:600;outline:0}
.ctl select{cursor:pointer;padding-right:36px}
.ctl input::placeholder{color:var(--muted);font-weight:400}
.ctl select.ph{color:var(--muted);font-weight:400}
.ctl option{background:var(--raised-2);color:var(--text)}
.ctl .suf{padding-right:12px;color:var(--muted);font-size:14px}
.ctl>svg{position:absolute;right:12px;color:var(--muted);pointer-events:none}
.ctl.ro{background:none;border-style:dashed;border-color:var(--line)}
.ctl.ro span{padding:0 12px;font-size:16px;font-weight:600}
.ctl.ro span.muted{font-weight:400;font-size:15px}
.chips-ed{display:flex;flex-wrap:wrap;align-items:center;gap:6px;min-height:44px}
.chip-ed{height:36px;padding:0 4px 0 10px;border:1px solid var(--line-strong);border-radius:4px;display:inline-flex;align-items:center;gap:2px;font-size:14px;font-weight:500}
.chip-ed button{width:28px;height:28px;display:grid;place-items:center;border-radius:4px;color:var(--muted)}
.chip-ed button:hover{color:var(--text);background:var(--raised-2)}
.chip-add{height:36px;padding:0 12px 0 8px;border:1px dashed var(--line-strong);border-radius:4px;display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.chip-add:hover{color:var(--text);border-color:var(--text)}
.chip-in{height:36px;width:150px;padding:0 10px;border:1px solid var(--text);border-radius:4px;background:var(--surface);color:var(--text);font:inherit;font-size:14px;outline:0}
.fx-note{margin:0;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;font-size:14px;line-height:20px;color:var(--muted)}
.lic-ed{padding:20px}
.lic-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lic-top a{font-size:14px;font-weight:500;color:var(--muted)}
.lic-top a:hover{color:var(--text)}
.lic-sub{margin:6px 0 0;font-size:14px;line-height:20px;color:var(--muted)}
.lrows{list-style:none;margin:14px 0 0;padding:0}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) 132px;align-items:center;column-gap:12px;row-gap:10px;padding:14px 0;border-top:1px solid var(--line)}
.lrow b{display:block;font-family:var(--fd);font-weight:700;font-size:12px;line-height:16px;letter-spacing:.04em}
.lrow small{display:block;margin-top:3px;font-size:13px;line-height:18px;color:var(--muted)}
.lrow.off b,.lrow.off .pr-in{opacity:.45}
.lr-x{grid-column:2 / 4}
.lrow.plain{grid-template-columns:auto minmax(0,1fr)}
.pr-in{display:flex;align-items:center;height:44px;border:1px solid var(--line-strong);border-radius:10px;background:var(--bg)}
.pr-in:focus-within{border-color:var(--text)}
.pr-in input{width:100%;min-width:0;height:100%;padding:0 4px 0 12px;border:0;background:none;color:var(--text);font:inherit;font-size:16px;font-weight:700;text-align:right;outline:0}
.pr-in input::placeholder{color:var(--muted);font-weight:400}
.pr-in span{padding-right:12px;color:var(--muted);font-weight:600}
.tgl{width:44px;height:26px;flex:none;border-radius:999px;background:var(--raised-2);border:1px solid var(--line-strong);position:relative;transition:background .2s,border-color .2s}
.tgl i{position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:var(--muted);transition:left .2s,background .2s}
.tgl.on{background:var(--text);border-color:var(--text)}
.tgl.on i{left:21px;background:var(--bg)}
.chk{display:inline-flex;align-items:center;gap:10px;min-height:36px;font-size:14px;line-height:20px;text-align:left}
.cbox{width:22px;height:22px;flex:none;border-radius:6px;border:1.5px solid var(--line-strong);display:grid;place-items:center;color:var(--bg)}
.cbox.on{background:var(--text);border-color:var(--text)}
.zip{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:14px;line-height:20px;min-width:0}
.zip b{font-family:var(--fs);font-size:14px;font-weight:600;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.zip span{color:var(--muted);white-space:nowrap}
.zip .okc{margin-left:auto;color:var(--ok)}
.btn.sm{height:36px;padding:0 12px;font-size:13px;border-radius:8px;justify-self:start}
.pub{padding:20px;display:flex;flex-direction:column;gap:14px}
.seg-r{display:grid;grid-template-columns:1fr 1fr;padding:3px;gap:2px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.seg-r button{height:38px;border-radius:9px;font-size:14px;font-weight:600;color:var(--muted)}
.seg-r button.on{background:var(--raised-2);color:var(--text)}
.pub-row{display:flex;align-items:center;gap:12px;text-align:left}
.pub-row b{display:block;font-weight:600;font-size:15px;line-height:20px}
.pub-row small{display:block;font-size:13px;line-height:18px;color:var(--muted)}
.st-cols .side{min-width:0;display:flex;flex-direction:column;gap:16px}
@container (max-width:1460px){.st-page .t-in{font-size:44px;line-height:48px}}
@container (max-width:1020px){.st-page .t-in{font-size:36px;line-height:40px}.fx-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.st-cols .side{order:0}}
@container (max-width:720px){.st-page .hero-grid{grid-template-columns:minmax(0,1fr)}.st-page .cv-col{order:-1;max-width:320px}}

/* ---------- широкие экраны (1440p, 4K, 21:9, 32:9) ----------
   колонка контента расширяется ступенями, сетка битов сама добавляет столбцы.
   на 1080p .d-main не шире 2312px, так что там ничего не меняется */
@container (min-width:2400px){.home,.page{max-width:1960px}.top-grid{grid-template-columns:minmax(0,1fr) 420px}.pgrid{gap:20px}}
@container (min-width:2900px){.home,.page{max-width:2320px}.feat{grid-template-columns:288px minmax(0,1fr)}.cols{grid-template-columns:minmax(0,1fr) 440px}.hero-grid{grid-template-columns:minmax(0,1fr) 460px}}
@container (min-width:3400px){.home,.page{max-width:2680px}.top-grid{grid-template-columns:minmax(0,1fr) 460px}}

/* ---------- студия на телефоне ---------- */
.ms-top{height:60px;padding:0 12px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}

      el.style.setProperty('--d', -d + 'px');

/* ===== десктоп: каркас ===== */
/* масштаб десктопа. до 1920×1000 включительно ровно 80%, как задумано.
   на экранах больше растёт плавно (степень 0.6), шаг 0.05:
   1440p и 4K@150% → 0.95 (физически столько же, сколько 80% на 24" 1080p),
   4K@100% → 1.2, ультраширокие считаются по высоте, поэтому как их 16:9-собратья */
var DZ = 0.8;
function calcDZ() {
  var s = Math.min(window.innerWidth / 1920, window.innerHeight / 1000);
  return s <= 1 ? 0.8 : Math.min(1.6, Math.round(0.8 * Math.pow(s, 0.6) * 20) / 20);
}
function applyDZ() { DZ = calcDZ(); document.documentElement.style.setProperty('--dz', DZ); }
applyDZ();
/* canvas внутри zoom: clientWidth отдаёт размер без зума, поэтому при зуме > 1 добираем плотность */

function wide() { return window.innerWidth / DZ >= 1360; }

  return m && BY[m[1]] ? { view: 'beat', page: m[1] } : { view: 'home' };
}

    if (r.view === 'beat') { st.page = r.page; st.mTab = 'beats'; st.mView = 'page'; st.player = false; }
    st.view = r.view;

  }

    var main = document.querySelector('.d-main');

function peaksFrom(ab) {
  var N = 720, len = ab.length, ch = Math.min(2, ab.numberOfChannels), data = [], vals = [], top = 0;

    var pk = 0, sq = 0, a = i * win, e = Math.min(len, a + win), n = 0;
    for (var j = a; j < e; j++) {

      var av = sm < 0 ? -sm : sm; if (av > pk) pk = av; sq += sm * sm; n++;
    }
    var v = 0.45 * pk + 0.55 * Math.sqrt(sq / Math.max(1, n)) * 1.9;
    vals.push(v); if (v > top) top = v;

  return vals.map(function (v) { return Math.pow(Math.max(0.04, v / (top || 1)), 0.72); });
}

  var v = el.getAttribute('data-v'), t;
  if (v === 'genres') {
    if (STU.genres.length < 3) { STU.adding = 'genres'; rerenderKeep(); t = document.getElementById('st-add'); }
    else t = document.getElementById('st-l-genres');
  } else t = document.getElementById(v);
  if (t) { if (t.focus) t.focus({ preventScroll: true }); t.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
};
ACT.stPublish = function () { stuPublish(); };
ACT.stPreview = function () {
  if (!stuCanPreview()) { toast(STU.phase !== 'ready' ? 'Сначала загрузи файл' : 'Поставь цену хотя бы на одну лицензию'); return; }
  stuDraft(); go('beat', 'draft');
};

document.addEventListener('input', function (e) {
  var t = e.target, s = STU;
  if (!t.id || t.id.indexOf('st-') !== 0) return;
  if (t.id === 'st-title') s.title = t.value.slice(0, 40);
  else if (t.id === 'st-about') s.about = t.value;
  else if (t.id === 'st-bpm') {
    var v = t.value.replace(/\D/g, '').slice(0, 3);
    if (v !== t.value) t.value = v;
    s.bpm = v; s.autoBpm = false;
    var a = t.closest('.fx').querySelector('.auto'); if (a) a.remove();
  } else if (t.getAttribute('data-lic')) {
    var d = t.value.replace(/\D/g, '').slice(0, 7);
    if (d !== t.value) t.value = d;
    s.lic[t.getAttribute('data-lic')].rub = d ? +d : '';
  } else return;
  studioSync();
});
document.addEventListener('change', function (e) {
  var t = e.target, s = STU;
  if (t.id === 'st-key') {
    s.key = t.value; s.autoKey = false; t.className = t.value ? '' : 'ph';
    var a = t.closest('.fx').querySelector('.auto'); if (a) a.remove();
    studioSync();
  }
  if (t.id === 'st-file' && t.files && t.files[0]) { var f = t.files[0]; t.value = ''; stuFile(f); }
  if (t.id === 'st-cover' && t.files && t.files[0]) { var c = t.files[0]; t.value = ''; stuCover(c); }
  if (t.id === 'st-zip' && t.files && t.files[0]) { var z = t.files[0]; t.value = ''; stuZip(z); }
});
document.addEventListener('keydown', function (e) {
  if (e.target.id === 'st-add') {
    if (e.key === 'Enter') { e.preventDefault(); stuAddCommit(e.target.value); }
    else if (e.key === 'Escape') { STU.adding = ''; rerenderKeep(); }
    return;
  }
  if (e.key === 'Escape' && st.menu) { st.menu = false; rerenderKeep(); }
});
document.addEventListener('focusout', function (e) {
  if (e.target.getAttribute && e.target.getAttribute('data-lic') && e.target.value) e.target.value = num(e.target.value.replace(/\D/g, ''));
  if (e.target.id === 'st-add' && STU.adding) { var v = e.target.value; setTimeout(function () { if (STU.adding) stuAddCommit(v); }, 0); }
});
/* перетаскивание файлов на страницу студии: звук в волну, картинка в обложку, zip в Track Out */
document.addEventListener('dragover', function (e) {
  if (st.view !== 'studio') return;
  var types = e.dataTransfer && e.dataTransfer.types;
  if (!types || Array.prototype.indexOf.call(types, 'Files') < 0) return;
  e.preventDefault();
  var h = document.getElementById('st-hero'); if (h) h.classList.add('is-drag');
});
document.addEventListener('dragleave', function (e) {
  if (st.view !== 'studio' || e.relatedTarget) return;
  var h = document.getElementById('st-hero'); if (h) h.classList.remove('is-drag');
});
document.addEventListener('drop', function (e) {
  if (st.view !== 'studio') return;
  e.preventDefault();
  var h = document.getElementById('st-hero'); if (h) h.classList.remove('is-drag');
  var fs = e.dataTransfer && e.dataTransfer.files, beat = null;
  if (!fs) return;
  for (var i = 0; i < fs.length; i++) {
    var f = fs[i];
    if (/^image\//.test(f.type)) stuCover(f);
    else if (/\.zip$/i.test(f.name)) stuZip(f);
    else if (!beat) beat = f;
  }
  if (beat) stuFile(beat);
});

(function () {
  var r = parseRoute();
  st.view = r.view;
  if (r.view === 'beat') { st.page = st.playing = r.page; if (mq.matches) { st.mTab = 'beats'; st.mView = 'page'; } }
  wasWide = wide();
  render.keep = false;
  render();
})();
})();
</script>
</body>
</html>
