<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0708">
<title>basswerk — прототип страницы бита</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;800;900&family=Onest:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0B0708;--surface:#141011;--raised:#1C1718;--raised-2:#2A2325;--line:#2F2829;--line-strong:#655B5D;--text:#F3EFEF;--muted:#9C9092;--ok:#2DB36F;--fd:Unbounded,"Arial Black",system-ui,sans-serif;--fs:Onest,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fs);font-size:16px;line-height:24px;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
svg.i{display:block;flex:none}
.av{display:grid;place-items:center;border-radius:50%;flex:none;font-family:var(--fd);font-weight:900;color:#F3EFEF;background:radial-gradient(120% 120% at 20% 100%,#5A4146,#1C1718 70%)}
.tag{flex:none;height:24px;padding:0 7px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-size:12px;font-weight:500;line-height:1;white-space:nowrap}
.btn{height:44px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line-strong);font-size:14px;font-weight:600;white-space:nowrap}
.btn:hover{border-color:var(--text)}
.btn-fill{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn-fill:hover{opacity:.92}
.ghost{color:var(--muted);border-radius:8px}
.ghost:hover{color:var(--text);background:var(--surface)}
.cover{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:#1C1718}

/* ---------- волна ---------- */
.wave{position:relative;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.wave canvas{display:block;width:100%;height:100%}
.w-line{position:absolute;top:0;bottom:0;width:1px;margin-left:-.5px;background:rgba(255,255,255,.85);pointer-events:none;opacity:0}
.w-tip{position:absolute;top:-30px;transform:translateX(-50%);height:22px;padding:0 7px;display:inline-flex;align-items:center;border-radius:4px;background:rgba(0,0,0,.72);color:#fff;font-size:12px;line-height:1;font-weight:600;pointer-events:none;white-space:nowrap;opacity:0}
.wave.is-hover .w-line,.wave.is-hover .w-tip{opacity:1}

/* ---------- десктоп ---------- */
.d{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.d-head{flex:none;border-bottom:1px solid var(--line)}
.d-head-in{max-width:2400px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.d-logo img{height:36px;width:auto;display:block}
.d-search{flex:1 1 320px;max-width:760px;position:relative;display:flex;align-items:center}
.d-search input{width:100%;height:44px;padding:0 16px 0 42px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);font-size:15px}
.d-search input::placeholder{color:var(--muted)}
.d-search svg{position:absolute;left:14px;color:var(--muted);pointer-events:none}
.d-tools{margin-left:auto;display:flex;align-items:center;gap:8px}
.icon44{width:44px;height:44px;display:grid;place-items:center;border-radius:10px}
.icon44:hover{background:var(--surface)}
.ticker{flex:none;height:36px;overflow:hidden;background:var(--surface);border-bottom:1px solid var(--line);font-size:12px;line-height:16px;display:flex;align-items:center}
.ticker-l{flex:none;padding:0 16px 0 24px;display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.06em;background:var(--surface);position:relative;z-index:1;height:100%}
.ticker-l i{width:7px;height:7px;border-radius:50%;background:var(--text)}
.ticker-run{display:flex;gap:28px;white-space:nowrap;animation:run 60s linear infinite;padding-right:28px}
.ticker-run span{display:inline-flex;gap:8px}
.ticker-run b{font-weight:700}.ticker-run .plus{color:var(--ok)}
@keyframes run{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.ticker-run{animation:none}}
.d-shell{flex:1;min-height:0;display:flex;position:relative;max-width:2400px;width:100%;margin:0 auto}
.strip{width:88px;flex:none;overflow-y:auto;scrollbar-width:none;border-right:1px solid var(--line)}
.strip::-webkit-scrollbar{display:none}
.strip-top{position:sticky;top:0;background:var(--bg);padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-bottom:1px solid var(--line)}
.live{display:inline-flex;align-items:center;gap:5px;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.06em;color:var(--muted)}
.live i{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.strip ol{list-style:none;margin:0;padding:16px 0;display:flex;flex-direction:column;align-items:center;gap:16px}
.strip li button{width:76px;display:flex;flex-direction:column;align-items:center;gap:8px}
.strip .ring{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--line-strong)}
.strip .ring.sale{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ok)}
.strip .ring.beat{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.strip small{font-family:var(--fd);font-weight:700;font-size:9px;line-height:14px;white-space:nowrap;color:var(--muted)}
.strip small.sale{color:var(--ok)}
.drawer{position:absolute;left:0;top:0;bottom:0;width:clamp(420px,31vw,600px);background:var(--bg);border-right:1px solid var(--line);z-index:30;overflow-y:auto;overscroll-behavior:contain;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);box-shadow:24px 0 48px rgba(0,0,0,.5)}
.scrim{position:absolute;inset:0;z-index:25;background:rgba(11,7,8,.62);opacity:0;pointer-events:none;transition:opacity .28s}
.is-feed .drawer{transform:none}
.is-feed .scrim{opacity:1;pointer-events:auto}
.is-feed .d-main{overflow:hidden}
.drawer-head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:16px 20px 12px;display:flex;flex-direction:column;gap:12px}
.drawer h2{margin:0;font-family:var(--fd);font-weight:700;font-size:22px;line-height:28px}
.chip{height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line-strong);font-size:13px;font-weight:500}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
.feed .meta{display:flex;align-items:baseline;gap:8px}
.feed .lbl{font-family:var(--fd);font-weight:700;font-size:10px;letter-spacing:.06em;color:var(--muted)}
.feed .lbl.sale{color:var(--ok)}
.feed-beat{margin-top:8px;display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.d-main{flex:1;min-width:0;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent;container-type:inline-size}
.page{max-width:1640px;margin:0 auto;padding:20px 32px 64px}
.hero{border-radius:20px;color:#F5F2F2;background:linear-gradient(110deg,var(--band2,#1B1718) 0%,var(--band,#2A2325) 62%);transition:background .5s ease}
.hero-grid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:48px;padding:32px}
.hero-l{min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:24px}
.hero-top{display:flex;gap:24px;align-items:flex-start}
.h-play{width:72px;height:72px;flex:none;margin-top:6px;border-radius:50%;background:#F5F2F2;color:#0B0708;display:grid;place-items:center}
.h-play:hover{transform:scale(1.04)}
.h-badge{display:inline-flex;align-items:center;gap:8px;font-family:var(--fd);font-weight:700;font-size:10px;line-height:16px;letter-spacing:.06em;color:rgba(245,242,242,.75)}
.h-badge b{height:20px;padding:0 6px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.5);border-radius:4px;color:#F5F2F2}
.h-title{margin:6px 0 0;font-family:var(--fd);font-weight:900;font-size:56px;line-height:60px;letter-spacing:-.015em;text-transform:uppercase;overflow-wrap:anywhere}
.h-meta{margin-top:12px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px;font-size:16px;line-height:22px;color:rgba(245,242,242,.75)}
.h-meta a{color:#F5F2F2;font-weight:600}
.h-tag{height:26px;padding:0 8px;display:inline-flex;align-items:center;border:1px solid rgba(245,242,242,.32);border-radius:4px;font-size:13px;font-weight:500;color:rgba(245,242,242,.9)}
.hero .wave{height:151px;margin-right:60px;cursor:pointer}
.hero .w-now,.hero .w-dur{position:absolute;right:-60px;width:52px;text-align:right;font-size:13px;line-height:18px}
.hero .w-now{top:68px;font-weight:700;color:#fff}
.hero .w-dur{top:95px;color:rgba(245,242,242,.62)}
.h-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.h-btn{height:44px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;background:rgba(0,0,0,.16);border:1px solid rgba(245,242,242,.26);color:#F5F2F2}
.h-btn:hover{background:rgba(0,0,0,.3);border-color:rgba(245,242,242,.6)}
.h-btn.on{background:#F5F2F2;color:#0B0708;border-color:#F5F2F2}
.h-btn.round{width:44px;padding:0;justify-content:center}
.h-buy{margin-left:auto;height:48px;padding:0 22px;border-radius:999px;display:inline-flex;align-items:center;background:#F5F2F2;color:#0B0708;font-size:15px;font-weight:700;white-space:nowrap}
.h-buy:hover{background:#fff}
.hero-cover{border-radius:12px;box-shadow:0 20px 56px rgba(0,0,0,.4)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:40px;align-items:start;margin-top:28px}
.sec-h{margin:0;font-family:var(--fd);font-weight:700;font-size:20px;line-height:26px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.facts{margin:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));column-gap:16px}
.facts div{padding:12px 0;border-top:1px solid var(--line);min-width:0}
.facts dt{font-size:13px;line-height:18px;color:var(--muted)}
.facts dd{margin:4px 0 0;font-weight:600;font-size:16px;line-height:22px;display:flex;flex-wrap:wrap;gap:4px}
.comments{list-style:none;margin:0;padding:0}
.comments li{padding:16px 0;border-bottom:1px solid var(--line)}
.c-row{display:flex;gap:12px}
.c-head{margin:0;display:flex;align-items:baseline;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}
.c-head b{font-weight:600;font-size:15px;color:var(--text)}
.c-text{margin:4px 0 0;font-size:15px;line-height:22px}
.c-acts{margin:6px 0 0 -10px;display:flex;gap:2px}
.c-acts button{height:32px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.author{height:18px;padding:0 5px;display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:4px;font-family:var(--fd);font-weight:700;font-size:9px;letter-spacing:.06em;color:var(--text);align-self:center}
.lic{padding:20px;display:flex;flex-direction:column}
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;background:var(--bg);border:1px solid var(--line);border-radius:12px}
.seg4 button{height:34px;border-radius:9px;font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--muted);white-space:nowrap;overflow:hidden}
.seg4 button:hover{color:var(--text)}
.seg4 button.on{background:var(--raised-2);color:var(--text)}
.price{margin:18px 0 0;font-family:var(--fd);font-weight:900;font-size:36px;line-height:42px;letter-spacing:-.01em;white-space:nowrap}
.terms{margin:6px 0 0;display:flex;flex-direction:column}
.terms div{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-top:1px solid var(--line);font-size:14px;line-height:20px}
.terms dt{color:var(--muted)}.terms dd{margin:0;text-align:right;font-weight:500}
.note{margin:12px 0 0;padding-top:12px;border-top:1px solid var(--line);display:flex;gap:8px;font-size:13px;line-height:18px;color:var(--muted)}
.note a{text-decoration:underline;text-underline-offset:2px}
.more-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:10px}
.more-row:hover{background:var(--raised)}
.more-row .open{flex:1;min-width:0;display:flex;align-items:center;gap:12px;text-align:left}
.more-row img{width:48px;height:48px;border-radius:6px;object-fit:cover;flex:none}
.pl-btn{width:40px;height:40px;flex:none;border-radius:50%;border:1px solid var(--line-strong);display:grid;place-items:center}
.pl-btn:hover{border-color:var(--text)}
.d-player{flex:none;background:var(--raised);border-top:1px solid var(--line)}
.d-player-in{max-width:2400px;margin:0 auto;height:72px;padding:0 24px;display:flex;align-items:center;gap:16px}
.d-player img{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none}
.pp{width:44px;height:44px;flex:none;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}
.prog{flex:1;max-width:560px;height:4px;border-radius:999px;background:var(--line);overflow:hidden;cursor:pointer}
.prog i{display:block;height:100%;background:var(--text);width:0}
@container (max-width:1240px){.cols{grid-template-columns:minmax(0,1fr) 360px}.hero-grid{grid-template-columns:minmax(0,1fr) 340px;gap:36px}}
@container (max-width:1020px){.cols{grid-template-columns:minmax(0,1fr)}.side{order:-1}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.hero-grid{grid-template-columns:minmax(0,1fr) 240px;gap:28px;padding:24px}.h-title{font-size:40px;line-height:44px}}
@container (max-width:720px){.hero-grid{grid-template-columns:minmax(0,1fr)}.hero-cover{display:none}}

/* ---------- телефон ---------- */
.m{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.m-top{flex:none;padding-top:env(safe-area-inset-top);background:var(--bg)}
.m-head{height:52px;padding:0 8px 0 16px;display:flex;align-items:center;gap:4px}
.m-head .d-logo{margin-right:auto}
.m-head .d-logo img{height:30px}
.m .ticker{height:34px;font-size:13px;border-top:1px solid var(--line)}
.m .ticker-l{padding-left:16px;font-size:11px}
.tabs{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
.tabs button{height:46px;font-family:var(--fd);font-weight:700;font-size:16px;color:var(--muted)}
.tabs button.on{color:var(--text);box-shadow:inset 0 -2px 0 var(--text)}
.m-body{flex:1;min-height:0;position:relative}
.m-feed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain}
.m-feed::-webkit-scrollbar{display:none}
.m-slot{height:100%;padding-bottom:8px;scroll-snap-align:start;scroll-snap-stop:always}
.m-card{position:relative;height:100%;border-radius:0 0 28px 28px;overflow:hidden;color:#F5F2F2;background:#1C1718}
.m-card>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.m-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,7,8,.5) 0%,rgba(11,7,8,0) 22%,transparent 46%,rgba(11,7,8,.85) 100%);background:linear-gradient(180deg,rgba(11,7,8,.5) 0%,rgba(11,7,8,0) 22%,transparent 38%,color-mix(in srgb,var(--band,#1C1718) 82%,transparent) 62%,var(--band,#1C1718) 80%);pointer-events:none}
.m-headbox{position:absolute;left:16px;top:16px;right:76px;display:flex;flex-direction:column;align-items:flex-start;z-index:2}
.box{display:inline-flex;align-items:center;background:#0B0708;color:#F5F2F2}
.box.t{margin:0;max-width:100%;padding:2px 10px;font-family:var(--fd);font-weight:900;font-size:24px;line-height:34px;text-transform:uppercase;border-radius:4px 4px 4px 0;white-space:nowrap;overflow:hidden}
.box.p{padding:2px 10px;font-weight:600;font-size:18px;line-height:28px;border-radius:0 4px 4px 4px}
.box.c{margin-top:10px;height:40px;padding:0 14px 0 12px;gap:8px;font-size:15px;font-weight:500;border-radius:4px}
.glass{background:rgba(11,7,8,.5);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid rgba(245,242,242,.14);color:#F5F2F2}
.m-more{position:absolute;right:16px;top:16px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:2}
.rail{position:absolute;right:12px;bottom:200px;display:flex;flex-direction:column;align-items:center;gap:14px;z-index:2}
.rail div{display:flex;flex-direction:column;align-items:center;gap:4px}
.rail button,.rail a{width:52px;height:52px;border-radius:50%;display:grid;place-items:center}
.rail .on{background:#F5F2F2;color:#0B0708}
.rail span{font-size:13px;line-height:16px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.7)}
.m-card .wave{position:absolute;left:0;right:0;bottom:92px;height:91px;z-index:1;cursor:grab}
.m-time{position:absolute;left:50%;top:34px;transform:translateX(-50%);height:26px;display:inline-flex;align-items:center;background:#0B0708;color:#F5F2F2;font-size:14px;line-height:1;font-weight:600;border-radius:3px;pointer-events:none}
.m-time b{padding:0 8px;font-weight:600}.m-time i{width:1px;height:14px;background:#655B5D}.m-time span{padding:0 8px;color:#B9ADAF}
.buy-pill{position:absolute;left:16px;right:16px;bottom:18px;height:56px;border-radius:999px;display:flex;align-items:center;justify-content:center;gap:10px;background:#F5F2F2;color:#0B0708;font-size:17px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35);z-index:2}
.m-tap{position:absolute;left:0;right:76px;top:150px;bottom:200px;z-index:1}
.m-flash{position:absolute;left:50%;top:44%;width:84px;height:84px;margin:-42px 0 0 -42px;border-radius:50%;display:grid;place-items:center;background:rgba(11,7,8,.55);pointer-events:none;opacity:0;transform:scale(.8);transition:opacity .25s,transform .25s;z-index:2}
.m-flash.show{opacity:1;transform:scale(1)}
.m-scroll{position:relative;height:100%;overflow-y:auto;scrollbar-width:none;overscroll-behavior:contain;padding-bottom:100px}
.m-scroll::-webkit-scrollbar{display:none}
.mp-bar{padding:12px 12px 0 16px;display:flex;align-items:center;gap:4px}
.back{width:44px;height:44px;margin-right:auto;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}
.mp-head{padding:12px 16px 0;display:flex;gap:16px;align-items:center}
.mp-head img{width:132px;height:132px;border-radius:10px;object-fit:cover;flex:none}
.mp-head h1{margin:0;font-family:var(--fd);font-weight:900;font-size:26px;line-height:32px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:clip}
.mp-acts{padding:10px 12px 0 6px;display:flex;align-items:center;gap:2px}
.mp-acts>button,.mp-acts>a{height:48px;padding:0 10px;border-radius:12px;display:inline-flex;align-items:center;gap:7px;font-size:17px;font-weight:600}
.mp-acts .play{margin-left:auto;width:60px;height:60px;padding:0;justify-content:center;border-radius:50%;background:var(--text);color:var(--bg)}
.m .tag{height:28px;padding:0 9px;font-size:14px}
.m .seg4{background:var(--surface);border-radius:13px}
.m .seg4 button{height:44px;font-size:13px;border-radius:10px}
.m .terms div{padding:11px 0;font-size:15px}
.m .lic{padding:0}
.m-list{height:100%;overflow-y:auto;padding-bottom:100px}
.mini{position:absolute;left:10px;right:10px;bottom:calc(64px + env(safe-area-inset-bottom) + 8px);height:68px;padding:0 8px;border-radius:34px;display:flex;align-items:center;gap:10px;background:var(--raised-2);border:1px solid var(--line);box-shadow:0 10px 30px rgba(0,0,0,.45);z-index:5}
.mini .ring{position:relative;width:52px;height:52px;flex:none;display:grid;place-items:center}
.mini .ring>svg{position:absolute;inset:0;transform:rotate(-90deg)}
.mini .ring span{width:40px;height:40px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center}

function plural(n, f) { var a = n % 100, b = n % 10; return a > 10 && a < 20 ? f[2] : b === 1 ? f[0] : b > 1 && b < 5 ? f[1] : f[2]; }

/* ===== телефон ===== */
function ringHTML(on) {
  return '<svg width="52" height="52" viewBox="0 0 52 52" aria-hidden="true"><circle cx="26" cy="26" r="24" fill="none" style="stroke:var(--line)" stroke-width="3"/><circle class="js-ring" cx="26" cy="26" r="24" fill="none" style="stroke:var(--text)" stroke-width="3" stroke-linecap="round" stroke-dasharray="' + (frac(st.playing) * 150.8).toFixed(1) + ' 151"/></svg><span>' + pp(on, 18) + '</span>';
}
function mobileHTML() {
  var h = '<div class="m">';
  h += '<div class="m-top"><div class="m-head"><a href="#" class="d-logo" aria-label="basswerk, на главную"><img src="logo.svg" alt="basswerk"></a><button type="button" class="icon44" aria-label="Поиск">' + ic('search', 24) + '</button><button type="button" class="icon44" aria-label="Настройки">' + ic('gear', 24) + '</button></div>' + tickerHTML() +
    '<div class="tabs" role="group" aria-label="Что показывать"><button type="button" data-act="mTab" data-v="feed" class="' + (st.mTab === 'feed' ? 'on' : '') + '" aria-pressed="' + (st.mTab === 'feed') + '">Лента</button><button type="button" data-act="mTab" data-v="beats" class="' + (st.mTab === 'beats' ? 'on' : '') + '" aria-pressed="' + (st.mTab === 'beats') + '">Биты</button></div></div>';
  h += '<div class="m-body">';
  if (st.mTab === 'feed') h += '<div class="m-list"><ol class="feed">' + FEED.map(feedItemHTML).join('') + '</ol></div>';
  else if (st.mView === 'cards') h += '<div class="m-feed" id="mfeed">' + BEATS.map(cardHTML).join('') + '</div>';
  else h += beatPageHTML(BY[st.page]);
  h += '</div>';
  if (!(st.mTab === 'beats' && st.mView === 'cards')) {
    var c = cur();
    h += '<div class="mini" role="region" aria-label="Плеер"><button type="button" class="ring" data-act="play" data-id="' + c.id + '" data-pp="" aria-label="' + (isOn(c.id) ? 'Пауза' : 'Слушать') + '">' + ringHTML(isOn(c.id)) + '</button><button type="button" data-act="openM" data-id="' + c.id + '" style="flex:1;min-width:0;text-align:left"><span style="display:block;font-family:var(--fd);font-weight:900;font-size:15px;line-height:20px;text-transform:uppercase;white-space:nowrap;overflow:hidden">' + esc(c.title) + '</span><span class="muted" style="display:block;font-size:14px;line-height:18px">' + esc(c.producer) + '</span></button><button type="button" class="icon44" data-act="like" data-id="' + c.id + '" aria-label="Нравится" aria-pressed="' + !!st.liked[c.id] + '" style="border-radius:50%">' + ic('heart', 24, st.liked[c.id]) + '</button><button type="button" class="icon44" data-act="buyM" data-id="' + c.id + '" aria-label="Купить" style="border-radius:50%;margin-right:4px">' + ic('bag', 22) + '</button></div>';
  }
  h += '<nav class="m-nav" aria-label="Навигация">' + [['home', 'Главная', 1], ['trend', 'Тренды'], ['upload', 'Загрузить'], ['badge', 'Лицензии']].map(function (x) { return '<a href="#" class="' + (x[2] ? 'on' : '') + '">' + ic(x[0], 26) + x[1] + '</a>'; }).join('') + '<a href="#"><span class="av" style="width:26px;height:26px;font-size:11px">M</span>Профиль</a></nav>';
  return h + '</div>';
}
function cardHTML(b, i) {
  var liked = !!st.liked[b.id], rep = !!st.reposted[b.id];
  return '<div class="m-slot" data-i="' + i + '"><article class="m-card" data-band="' + b.id + '" style="--band:' + b.band + ';--band2:' + b.band2 + '" aria-label="' + esc(b.title) + '"><img src="' + b.cover + '" alt=""><div class="m-shade"></div>' +
    '<div class="m-headbox"><h2 class="box t">' + esc(b.title) + '</h2><a href="#" class="box p">' + esc(b.producer) + '</a><button type="button" class="box c" data-act="openM" data-id="' + b.id + '">' + ic('bars', 18) + 'О бите</button></div>' +
    '<button type="button" class="glass m-more" aria-label="Ещё">' + ic('more', 22) + '</button>' +
    '<button type="button" class="m-tap" data-act="cardTap" data-id="' + b.id + '" aria-label="Пауза или play"></button><span class="m-flash" aria-hidden="true">' + ic('pause', 34) + '</span>' +
    '<div class="rail"><div><button type="button" class="glass' + (liked ? ' on' : '') + '" data-act="like" data-id="' + b.id + '" aria-pressed="' + liked + '" aria-label="Нравится">' + ic('heart', 26, liked) + '</button><span>' + num(b.likes + (liked ? 1 : 0)) + '</span></div>' +
    '<div><button type="button" class="glass" data-act="openCom" data-id="' + b.id + '" aria-label="Комментарии">' + ic('msg', 25) + '</button><span>' + b.comments + '</span></div>' +
    '<div><button type="button" class="glass' + (rep ? ' on' : '') + '" data-act="repost" data-id="' + b.id + '" aria-pressed="' + rep + '" aria-label="Репост">' + ic('repost', 24) + '</button><span>' + (b.reposts + (rep ? 1 : 0)) + '</span></div>' +
    '<div><button type="button" class="glass" aria-label="Поделиться">' + ic('share', 24) + '</button></div></div>' +
    '<div class="wave js-wave" data-id="' + b.id + '" data-kind="strip" aria-hidden="true"><canvas></canvas><span class="m-time"><b class="w-now">0:00</b><i></i><span>' + fmt(b.dur) + '</span></span></div>' +
    '<button type="button" class="buy-pill" data-act="buyM" data-id="' + b.id + '">' + ic('bag', 20) + 'Купить от ' + money(b.rub) + '</button></article></div>';
}
function beatPageHTML(b) {
  var liked = !!st.liked[b.id], rep = !!st.reposted[b.id];
  var h = '<div class="m-scroll" id="mscroll"><div class="mp-bar"><button type="button" class="back" data-act="mBack" aria-label="Назад к битам">' + ic('back', 24) + '</button><button type="button" class="icon44" aria-label="Скопировать ссылку">' + ic('link', 22) + '</button><button type="button" class="icon44" aria-label="Ещё">' + ic('more', 22) + '</button></div>';
  h += '<div class="mp-head"><img src="' + b.cover + '" alt="Обложка бита ' + esc(b.title) + '"><div style="min-width:0;flex:1"><h1>' + esc(b.title) + '</h1><a href="#" style="display:inline-block;margin-top:4px;font-weight:600;font-size:18px;line-height:24px">' + esc(b.producer) + '</a><p class="muted" style="margin:8px 0 0;font-size:14px;line-height:20px">' + b.plays + ' прослушиваний<br>' + fmt(b.dur) + ' ' + b.date + '</p></div></div>';
  h += '<div class="mp-acts"><button type="button" data-act="like" data-id="' + b.id + '" aria-pressed="' + liked + '" aria-label="Нравится">' + ic('heart', 26, liked) + num(b.likes + (liked ? 1 : 0)) + '</button><a href="#m-com" data-act="toCom">' + ic('msg', 25) + b.comments + '</a><button type="button" data-act="repost" data-id="' + b.id + '" aria-pressed="' + rep + '" aria-label="Репост"' + (rep ? ' style="color:var(--text);background:var(--raised-2)"' : '') + '>' + ic('repost', 25) + (b.reposts + (rep ? 1 : 0)) + '</button><button type="button" aria-label="Поделиться">' + ic('share', 24) + '</button><button type="button" class="play" data-act="play" data-id="' + b.id + '" data-pp="' + b.id + '" data-size="24" aria-label="' + (isOn(b.id) ? 'Пауза' : 'Слушать') + '">' + pp(isOn(b.id), 24) + '</button></div>';
  h += '<div style="padding:14px 16px 0;display:flex;flex-wrap:wrap;gap:6px"><span class="tag">' + b.genre + '</span><span class="tag">' + b.genres[1] + '</span><span class="tag">' + b.bpm + ' BPM</span><span class="tag">' + b.key + '</span></div>';
  h += '<div style="padding:18px 16px 0"><p class="h-badge muted" style="margin:0;color:var(--muted)">ОТ АВТОРА</p><p style="margin:6px 0 0;font-size:16px;line-height:25px">' + esc(b.desc) + '</p></div>';
  h += '<div style="margin:18px 16px 0;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px"><span class="av" style="width:52px;height:52px;font-size:20px">K</span><div style="flex:1;min-width:0"><a href="#" style="font-weight:700;font-size:17px;line-height:22px">kxlteen</a><p class="muted" style="margin:2px 0 0;font-size:14px;line-height:20px;white-space:nowrap;overflow:hidden">Москва  12,4 тыс. подписчиков</p></div><button type="button" class="btn" data-act="follow" style="border-radius:999px;font-size:15px">' + (st.following ? 'Ты подписан' : 'Подписаться') + '</button></div>';
  h += '<div style="padding:22px 16px 0">' + licHTML(b, true) + '</div>';
  h += '<section style="padding:30px 16px 0" aria-labelledby="mah"><h2 class="sec-h" id="mah" style="margin-bottom:8px">О бите</h2><dl class="facts" style="grid-template-columns:1fr 1fr">' + [['Тональность', b.key], ['Темп', b.bpm + ' BPM'], ['Жанр', b.genres.join(', ')], ['Настроение', b.moods.join(', ')], ['Прослушивания', b.plays], ['Купили', b.bought]].map(function (x) { return '<div><dt style="font-size:14px">' + x[0] + '</dt><dd style="font-size:17px">' + x[1] + '</dd></div>'; }).join('') + '</dl></section>';
  h += commentsHTML(b, true) + '</div>';
  return h;
}

/* ===== рендер ===== */
var mq = window.matchMedia('(max-width: 700px)');
var feedObs = null;
function render() {
  var keepScroll = null, main = document.querySelector('.d-main, #mscroll'), feedEl = document.getElementById('mfeed');
  if (main) keepScroll = main.scrollTop;
  var feedScroll = feedEl ? feedEl.scrollTop : null;
  document.getElementById('app').innerHTML = mq.matches ? mobileHTML() : desktopHTML();
  main = document.querySelector('.d-main, #mscroll');
  if (main && keepScroll != null && render.keep) main.scrollTop = keepScroll;
  feedEl = document.getElementById('mfeed');
  if (feedEl) {
    feedEl.scrollTop = feedScroll != null && render.keep ? feedScroll : st.active * feedEl.clientHeight;
    observeCards(feedEl);
  }
  render.keep = true;
  mountWaves();
}
function rerenderKeep() { render.keep = true; render(); }
function observeCards(root) {
  if (feedObs) feedObs.disconnect();
  if (!('IntersectionObserver' in window)) return;
  feedObs = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var i = +e.target.getAttribute('data-i'), b = BEATS[i];
      if (st.active === i && st.playing === b.id) return;
      st.active = i;
      if (st.playing !== b.id) { st.playing = b.id; st.pos = 0; st.paused = false; tickUI(); }
    });
  }, { root: root, threshold: 0.6 });
  root.querySelectorAll('.m-slot').forEach(function (s) { feedObs.observe(s); });
}
mq.addEventListener ? mq.addEventListener('change', function () { render.keep = false; render(); }) : mq.addListener(function () { render(); });
var rT;
window.addEventListener('resize', function () { clearTimeout(rT); rT = setTimeout(function () { waves.forEach(function (w) { w.paint(); }); }, 60); });

/* ===== действия ===== */
var ACT = {
  play: function (el) { togglePlay(el.getAttribute('data-id')); },
  like: function (el) { var id = el.getAttribute('data-id'); st.liked[id] = !st.liked[id]; rerenderKeep(); },
  repost: function (el) { var id = el.getAttribute('data-id'); st.reposted[id] = !st.reposted[id]; rerenderKeep(); },
  follow: function () { st.following = !st.following; rerenderKeep(); },
  lic: function (el) { st.lic = el.getAttribute('data-v'); rerenderKeep(); },
  terms: function () { st.terms = !st.terms; rerenderKeep(); },
  promo: function () { st.promo = true; rerenderKeep(); var i = document.getElementById('promo'); if (i) i.focus(); },
  feed: function () { st.feed = true; document.querySelector('.d-shell').classList.add('is-feed'); document.querySelector('.drawer').removeAttribute('inert'); },
  feedClose: function () { st.feed = false; document.querySelector('.d-shell').classList.remove('is-feed'); document.querySelector('.drawer').setAttribute('inert', ''); },
  feedFilter: function (el) { var k = el.getAttribute('data-v'); st.feedOff[k] = !st.feedOff[k]; var d = document.querySelector('.drawer'), s = d.scrollTop; rerenderKeep(); document.querySelector('.drawer').scrollTop = s; },
  open: function (el) { if (mq.matches) { ACT.openM(el); return; } var id = el.getAttribute('data-id'); st.page = id; if (st.playing !== id) { st.playing = id; st.pos = 0; } st.paused = false; st.feed = false; render.keep = false; render(); },
  toBuy: function (el, e) { e.preventDefault(); var t = document.getElementById('buy'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  toBuyCur: function (el, e) { e.preventDefault(); if (st.page !== st.playing) { st.page = st.playing; render.keep = false; render(); } var t = document.getElementById('buy'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  prev: function () { var i = BEATS.indexOf(cur()); seekBeat(BEATS[(i + BEATS.length - 1) % BEATS.length].id); },
  next: function () { var i = BEATS.indexOf(cur()); seekBeat(BEATS[(i + 1) % BEATS.length].id); },
  progSeek: function (el, e) { var r = el.getBoundingClientRect(); st.pos = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * cur().dur; tickUI(); },
  mTab: function (el) { st.mTab = el.getAttribute('data-v'); st.mView = 'cards'; render.keep = false; render(); },
  openM: function (el) { st.page = el.getAttribute('data-id'); st.mTab = 'beats'; st.mView = 'page'; render.keep = false; render(); },
  openCom: function (el) { ACT.openM(el); var t = document.getElementById('m-com'); if (t) t.scrollIntoView({ block: 'start' }); },
  buyM: function (el) { ACT.openM(el); var t = document.getElementById('m-buy'); if (t) document.getElementById('mscroll').scrollTop = t.parentNode.offsetTop - 8; },
  toCom: function (el, e) { e.preventDefault(); var t = document.getElementById('m-com'); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); },
  mBack: function () { st.mView = 'cards'; st.active = Math.max(0, BEATS.indexOf(BY[st.page])); render.keep = false; render(); },
  cardTap: function (el) {
    var id = el.getAttribute('data-id');
    if (st.playing !== id) { st.playing = id; st.pos = 0; st.paused = false; } else st.paused = !st.paused;
    var fl = el.parentNode.querySelector('.m-flash');
    fl.innerHTML = ic(st.paused ? 'pause' : 'play', 34); fl.classList.add('show');
    clearTimeout(fl._t); fl._t = setTimeout(function () { fl.classList.remove('show'); }, 600);
    syncPlayButtons();
  }
};
function seekBeat(id) { st.playing = id; st.pos = 0; st.paused = false; if (!mq.matches) st.page = id; render.keep = false; render(); }
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) { if (e.target.closest('a[href="#"]')) e.preventDefault(); return; }
  var a = el.getAttribute('data-act');
  if (ACT[a]) { if (el.tagName === 'A' && a !== 'toCom') e.preventDefault(); ACT[a](el, e); }
});
document.addEventListener('submit', function (e) { e.preventDefault(); var i = e.target.querySelector('input'); if (i) i.value = ''; });
document.addEventListener('keydown', function (e) {
  var w = e.target.closest && e.target.closest('.js-wave');
  if (w && (e.key === 'ArrowRight' || e.key === 'ArrowLeft')) { e.preventDefault(); var id = w.getAttribute('data-id'); seek(id, Math.max(0, Math.min(BY[id].dur, (st.playing === id ? st.pos : 0) + (e.key === 'ArrowRight' ? 5 : -5)))); }
  if (e.key === ' ' && e.target === document.body) { e.preventDefault(); togglePlay(st.playing); }
  if (e.key === 'Escape' && st.feed) ACT.feedClose();
});

render.keep = false;
render();
})();
</script>
